    }
    // 5) name reveal
    if (p > 0.92) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff9a2b'; ctx.font = 'bold 42px "Courier New", monospace'; ctx.globalAlpha = Math.min(1, (p - 0.92) * 8);
      ctx.fillText(boss.name, cx, cy - 40); ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff'; ctx.font = 'bold 16px "Courier New", monospace'; ctx.fillText('THE TITAN RISES!', cx, cy + 200);
      ctx.textAlign = 'left';
    }
    ctx.fillStyle = '#555'; ctx.font = '11px "Courier New", monospace'; ctx.fillText('Press SPACE to skip', CANVAS_W / 2 - 60, CANVAS_H - 10);
  }

  // ---- GOO GOLEM (skin 2): stones fly in and assemble ----
  function drawGolemCinematic() {
    var p = Math.min(1, (boss.introTotal - introTimer) / boss.introTotal);
    var cx = CANVAS_W / 2, cy = CANVAS_H / 2;
    ctx.fillStyle = 'rgba(8,8,10,0.97)'; ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    // 1) floating stones converge
    for (var i = 0; i < 12; i++) {
      var a = i * 2.3 + p * 1.5;
      var dist = (1 - Math.min(1, p / 0.4)) * 340 + 20;
      var sx = cx + Math.cos(a) * dist, sy = cy + Math.sin(a) * dist * 0.7;
      var sz = 8 + (i % 4) * 5;
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(a * 3);
      ctx.fillStyle = '#5a6470'; ctx.fillRect(-sz / 2, -sz / 2, sz, sz);
      ctx.fillStyle = '#6a7480'; ctx.fillRect(-sz / 2, -sz / 2, sz, sz / 3);
      ctx.restore();
    }
    // 2) golem assembles from the stones
    var form = Math.max(0, (p - 0.35) / 0.35);
    if (form > 0) { ctx.save(); ctx.translate(cx, cy + 55); ctx.scale(1.1 * form, 1.1 * form); drawBossBody(2, 0, 0, 1); ctx.restore(); }
    // 3) blue cracks glow
    if (p > 0.7) {
      var gl = Math.min(1, (p - 0.7) / 0.15);
      ctx.strokeStyle = 'rgba(43,212,255,' + gl * (0.5 + Math.abs(Math.sin(p * 20)) * 0.5) + ')';
      ctx.lineWidth = 3;
      for (var cr = 0; cr < 8; cr++) { var ca = cr * 0.8 + p * 2; ctx.beginPath(); ctx.moveTo(cx, cy + 55); ctx.lineTo(cx + Math.cos(ca) * 60 * gl, cy + 55 - 40 * gl); ctx.stroke(); }
    }
    // 4) eyes ignite red + slam
    if (p > 0.85) {
      var e2 = Math.min(1, (p - 0.85) / 0.1);
      ctx.fillStyle = '#ff3a2b'; ctx.beginPath(); ctx.arc(cx - 11, cy + 28, 3 + e2 * 5, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(cx + 11, cy + 28, 3 + e2 * 5, 0, Math.PI * 2); ctx.fill();
      if (p > 0.9) { ctx.fillStyle = 'rgba(255,255,255,' + ((p - 0.9) * 10 % 1) * 0.2 + ')'; ctx.fillRect(0, 0, CANVAS_W, CANVAS_H); }
    }
    if (p > 0.92) {
      ctx.textAlign = 'center'; ctx.fillStyle = '#ffd42a'; ctx.font = 'bold 42px "Courier New", monospace'; ctx.globalAlpha = Math.min(1, (p - 0.92) * 8);
      ctx.fillText(boss.name, cx, cy - 40); ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff'; ctx.font = 'bold 16px "Courier New", monospace'; ctx.fillText('THE GOLEM AWAKENS!', cx, cy + 200); ctx.textAlign = 'left';
    }
    ctx.fillStyle = '#555'; ctx.font = '11px "Courier New", monospace'; ctx.fillText('Press SPACE to skip', CANVAS_W / 2 - 60, CANVAS_H - 10);
  }

  // ---- GLOOP GOBBLER (skin 3): a giant maw opens and inhales ----
  function drawGobblerCinematic() {
    var p = Math.min(1, (boss.introTotal - introTimer) / boss.introTotal);
    var cx = CANVAS_W / 2, cy = CANVAS_H / 2;
    ctx.fillStyle = 'rgba(4,3,8,0.97)'; ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    // 1) glowing eyes in the dark
    var eye = Math.min(1, p / 0.3);
    ctx.fillStyle = '#7a2bd4'; ctx.beginPath(); ctx.arc(cx - 60, cy - 40, 6 * eye, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(cx + 60, cy - 40, 6 * eye, 0, Math.PI * 2); ctx.fill();
    // 2) the maw opens (widening arc with teeth)
    var open = Math.max(0, (p - 0.25) / 0.35);
    var mouthH = open * 90, mouthW = 40 + open * 120;
    ctx.fillStyle = '#3a0a50'; fillEllipse(cx, cy + 40, mouthW, mouthH);
    ctx.fillStyle = '#000'; fillEllipse(cx, cy + 46, mouthW * 0.7, mouthH * 0.7);
    // teeth ring
    ctx.fillStyle = '#fff';
    for (var t = -9; t <= 9; t++) { ctx.fillRect(cx + t * (mouthW / 11) - 3, cy + 40 - mouthH - 4, 5, 8); }
    // 3) inhale: debris flies into the mouth
    if (open > 0.6) {
      var inh = Math.min(1, Math.max(0, (p - 0.6) / 0.2));
      for (var d2 = 0; d2 < 14; d2++) {
        var da = d2 * 2.6 + p * 8; var dist = (1 - inh) * 300 + 20;
        var dx = cx + Math.cos(da) * dist, dy = cy + Math.sin(da) * dist * 0.7;
        var tw = 0.4 + Math.abs(Math.sin(d2 + p * 20)) * 0.6;
        ctx.fillStyle = 'rgba(150,150,160,' + tw + ')';
        ctx.save(); ctx.translate(dx, dy); ctx.rotate(da * 2); ctx.fillRect(-4, -4, 8, 8); ctx.restore();
      }
      ctx.fillStyle = 'rgba(122,43,212,0.4)';
      for (var sw = 0; sw < 3; sw++) { ctx.beginPath(); ctx.arc(cx, cy + 40, (sw * 30 + 20) * (1 - inh), 0, Math.PI * 2); ctx.fill(); }
    }
    // 4) roar + purple shockwave
    if (p > 0.82) {
      var roar = Math.min(1, (p - 0.82) / 0.1);
      var pulse = Math.abs(Math.sin(p * 30));
      ctx.strokeStyle = 'rgba(122,43,212,' + roar * (0.4 + pulse * 0.6) + ')'; ctx.lineWidth = 6;
      for (var rw = 0; rw < 3; rw++) { ctx.beginPath(); ctx.arc(cx, cy + 40, (40 + rw * 30) * roar + 20, 0, Math.PI * 2); ctx.stroke(); }
    }
    if (p > 0.92) {
      ctx.textAlign = 'center'; ctx.fillStyle = '#7a2bd4'; ctx.font = 'bold 42px "Courier New", monospace'; ctx.globalAlpha = Math.min(1, (p - 0.92) * 8);
      ctx.fillText(boss.name, cx, cy - 40); ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff'; ctx.font = 'bold 16px "Courier New", monospace'; ctx.fillText('IT WILL DEVOUR ALL!', cx, cy + 200); ctx.textAlign = 'left';
    }
    ctx.fillStyle = '#555'; ctx.font = '11px "Courier New", monospace'; ctx.fillText('Press SPACE to skip', CANVAS_W / 2 - 60, CANVAS_H - 10);
  }

  // ---- GIANT RAT cinematic: ~3 minutes, dramatic multi-phase ----
  function drawRatCinematic() {
    var total = boss.introTotal || RAT_INTRO;
    var p = Math.min(1, (total - introTimer) / total);
    var cx = CANVAS_W / 2, cy = CANVAS_H / 2;
    ctx.fillStyle = '#030303'; ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    var phase = Math.floor(p * 12);
    var t = (p * 12) % 1;
    var shake = (1 - t) * 4;

    if (phase === 0 || phase === 9) { // glowing red eyes in darkness
      var e = phase === 0 ? t : (1 - t);
      ctx.fillStyle = 'rgba(255,30,20,' + (0.2 + e * 0.6) + ')';
      ctx.beginPath(); ctx.arc(cx - 60, cy - 30, 8 + e * 30, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 60, cy - 30, 8 + e * 30, 0, Math.PI * 2); ctx.fill();
      ctx.textAlign = 'center'; ctx.fillStyle = '#888'; ctx.font = 'bold 20px "Courier New", monospace';
      ctx.fillText(phase === 0 ? 'The sewers stir...' : '...', cx, cy + 120); ctx.textAlign = 'left';
    } else if (phase === 1) { // rat scurries across the shadows
      var xx = ((t * 2) % 1) * CANVAS_W;
      ctx.fillStyle = 'rgba(90,60,30,0.5)'; ctx.beginPath(); ctx.arc(xx, cy + 20, 14, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 2;
      for (var m = 0; m < 5; m++) { ctx.beginPath(); ctx.moveTo(xx + m * 22, cy + 34); ctx.lineTo(xx + m * 22 - 10, cy + 40); ctx.stroke(); }
      ctx.textAlign = 'center'; ctx.fillStyle = '#888'; ctx.font = 'bold 18px "Courier New", monospace'; ctx.fillText('Something is moving...', cx, 430); ctx.textAlign = 'left';
    } else if (phase === 2) { // gnawing teeth close-up + shake
      ctx.save(); ctx.translate(shake, 0);
      ctx.fillStyle = '#3a2410'; ctx.beginPath(); ctx.arc(cx, cy, 90, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      for (var tg = -4; tg <= 4; tg++) { ctx.fillRect(cx + tg * 16 - 5, cy - 30, 10, 20); ctx.fillRect(cx + tg * 16 - 5, cy + 10, 10, 20); }
      ctx.fillStyle = '#c00'; ctx.beginPath(); ctx.arc(cx - 60, cy, 5, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(cx + 60, cy, 5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.textAlign = 'center'; ctx.fillStyle = '#c0392b'; ctx.font = 'bold 30px "Courier New", monospace'; ctx.fillText('CRUNCH... CRUNCH...', cx, cy + 160); ctx.textAlign = 'left';
    } else if (phase === 3) { // low growl rumble rings
      ctx.fillStyle = 'rgba(120,60,30,' + (0.1 + t * 0.2) + ')'; ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.strokeStyle = 'rgba(180,80,40,' + (0.3 + t * 0.5) + ')'; ctx.lineWidth = 6;
      for (var r = 0; r < 4; r++) { ctx.beginPath(); ctx.arc(cx, cy, (40 + r * 30) * t + 20, 0, Math.PI * 2); ctx.stroke(); }
      ctx.textAlign = 'center'; ctx.fillStyle = '#ccc'; ctx.font = 'bold 22px "Courier New", monospace'; ctx.fillText('A low growl rumbles...', cx, 400); ctx.textAlign = 'left';
    } else if (phase === 4) { // swarm of normal enemies pour out
      for (var i = 0; i < 10; i++) {
        var a = i * 2.4 + t * 4;
        var rr2 = (1 - t) * 260 + 20;
        ctx.fillStyle = i % 2 ? '#2b7fd4' : '#2ecc40';
        ctx.beginPath(); ctx.arc(cx + Math.cos(a) * rr2, cy + Math.sin(a) * rr2 * 0.6, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * rr2 - 2, cy + Math.sin(a) * rr2 * 0.6 - 2, 2, 0, Math.PI * 2); ctx.fill();
      }
      ctx.textAlign = 'center'; ctx.fillStyle = '#888'; ctx.font = 'bold 20px "Courier New", monospace'; ctx.fillText('ITS MINIONS SWARM!', cx, 400); ctx.textAlign = 'left';
    } else if (phase === 5) { // a brute emerges
      ctx.save(); ctx.translate(cx, cy + 60); ctx.scale(0.4 + t * 2, 0.4 + t * 2);
      ctx.fillStyle = '#555a66'; ctx.fillRect(-16, -12, 32, 28);
      ctx.fillStyle = '#8a8f9a'; ctx.fillRect(-12, -8, 24, 18);
      ctx.fillStyle = '#aab0bd'; ctx.fillRect(-18, -20, 36, 10);
      ctx.fillStyle = '#c00'; ctx.beginPath(); ctx.arc(-6, 0, 4, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(6, 0, 4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.textAlign = 'center'; ctx.fillStyle = '#ccc'; ctx.font = 'bold 20px "Courier New", monospace'; ctx.fillText('...A GUARD RISES...', cx, 400); ctx.textAlign = 'left';
    } else if (phase === 6) { // charge across the arena
      var xx2 = (t * 1.6 % 1) * CANVAS_W;
      ctx.save(); ctx.translate(xx2, cy + 40); ctx.scale(1.6, 1.6); drawBossBody(4, 0, 0, 1); ctx.restore();
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      for (var d2 = 0; d2 < 6; d2++) ctx.fillRect(xx2 - 16 - d2 * 14, cy + 70, 8, 8);
      ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = 'bold 26px "Courier New", monospace'; ctx.fillText('IT HUNTS YOU!', cx, 430); ctx.textAlign = 'left';
    } else if (phase === 7) { // rears up + roars red flash
      var pulse = Math.abs(Math.sin(t * Math.PI * 10));
      ctx.save(); ctx.translate(cx + Math.sin(t * 40) * 8, cy + 40); ctx.scale(1 + pulse * 0.3, 1 + pulse * 0.3); drawBossBody(4, 0, 0, 1); ctx.restore();
      ctx.fillStyle = 'rgba(255,30,20,' + pulse * 0.3 + ')'; ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.strokeStyle = 'rgba(255,60,40,' + pulse + ')'; ctx.lineWidth = 4;
      for (var rr = 0; rr < 3; rr++) { ctx.beginPath(); ctx.arc(cx, cy + 40, 120 + rr * 40 + pulse * 20, 0, Math.PI * 2); ctx.stroke(); }
      ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = 'bold 34px "Courier New", monospace'; ctx.fillText('RAAAAARGH!', cx, 120); ctx.textAlign = 'left';
    } else if (phase === 8) { // tail whip + shake
      ctx.save(); ctx.translate(Math.sin(t * 50) * 6, Math.sin(t * 47) * 6);
      ctx.save(); ctx.translate(cx, cy + 40); ctx.scale(1.4, 1.4); drawBossBody(4, 0, 0, 1); ctx.restore();
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.3 + t * 0.4) + ')'; ctx.lineWidth = 3;
      for (var w = 0; w < 6; w++) { var wa = w * 2 + t * 10; ctx.beginPath(); ctx.moveTo(cx, cy + 60); ctx.lineTo(cx + Math.cos(wa) * 90, cy + 60 + Math.sin(wa) * 30); ctx.stroke(); }
      ctx.restore();
      ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = 'bold 22px "Courier New", monospace'; ctx.fillText('THWIP! THWIP!', cx, 150); ctx.textAlign = 'left';
    } else if (phase === 10) { // full reveal zoom
      var sc = 0.2 + t * 3.4;
      ctx.fillStyle = 'rgba(120,60,30,' + (0.1 + t * 0.15) + ')'; ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.save(); ctx.translate(cx, cy + 40); ctx.scale(sc, sc); drawBossBody(4, 0, 0, 1); ctx.restore();
      ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = 'bold 24px "Courier New", monospace'; ctx.fillText('THE KING OF THE SEWERS', cx, cy + 120); ctx.textAlign = 'left';
    } else { // phase 11: name reveal
      for (var rn = 0; rn < 24; rn++) { var ra = rn / 24 * Math.PI * 2; var rr3 = 220 + Math.sin(rn * 3 + t * 20) * 30;
        ctx.fillStyle = 'rgba(255,255,255,' + (0.05 + t * 0.1) + ')'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(ra) * rr3, cy + Math.sin(ra) * rr3); ctx.stroke(); }
      ctx.save(); ctx.translate(cx, cy + 40); ctx.scale(1 + t * 0.2, 1 + t * 0.2); drawBossBody(4, 0, 0, 1); ctx.restore();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff3a2b'; ctx.font = 'bold 46px "Courier New", monospace'; ctx.fillText('THE GIANT RAT', cx, cy - 90);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 18px "Courier New", monospace'; ctx.fillText('DEFEAT IT TO CLAIM THE TROPHY!', cx, cy + 140);
      ctx.textAlign = 'left';
    }
    ctx.fillStyle = '#555'; ctx.font = '11px "Courier New", monospace'; ctx.fillText('Press SPACE to skip', CANVAS_W / 2 - 60, CANVAS_H - 10);
  }

  function drawEnemyShot(type) {
    var phase = 1 - (introTimer / ENEMY_INTRO_FRAMES);
    ctx.fillStyle = 'rgba(4,5,10,0.96)'; ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    var pulse = Math.abs(Math.sin(phase * Math.PI * 8));
    var glow = ctx.createRadialGradient(CANVAS_W / 2, CANVAS_H / 2 - 40, 10, CANVAS_W / 2, CANVAS_H / 2 - 40, 320);
    glow.addColorStop(0, 'rgba(120,120,200,' + (0.18 + pulse * 0.15) + ')'); glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    var scale = Math.min(4, 1 + phase * 3);
    var shake = (1 - phase) * 6 * Math.sin(phase * Math.PI * 30);
    ctx.save(); ctx.translate(CANVAS_W / 2 + shake, CANVAS_H / 2 - 20); ctx.scale(scale, scale); drawEnemyBig(type); ctx.restore();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd42a'; ctx.font = 'bold 36px "Courier New", monospace'; ctx.globalAlpha = Math.min(1, phase * 4);
    ctx.fillText(enemyName(type), CANVAS_W / 2, CANVAS_H / 2 + 100); ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px "Courier New", monospace'; ctx.fillText('ENEMY APPROACHING!', CANVAS_W / 2, CANVAS_H / 2 + 128);
    ctx.fillStyle = '#6b7390'; ctx.font = '12px "Courier New", monospace'; ctx.fillText('Press SPACE to skip', CANVAS_W / 2, 320);
    ctx.textAlign = 'left';
  }

  function enemyName(type) {
    var n = { patrol: 'PATROLLER', charger: 'CHARGER', hopper: 'HOPPER', chaser: 'CHASER', cannon: 'CANNON', boss: 'BOSS', fireball: 'FIREBALL', snake: 'SNAKE', ghost: 'GHOST', mole: 'MOLE', flyer: 'FLYER', brute: 'BRUTE' };
    return n[type] || type.toUpperCase();
  }

  function drawSludgeCinematic() {
    var total = boss.introTotal || 2400;
    var p = Math.min(1, (total - introTimer) / total);
    var cx = CANVAS_W / 2, cy = CANVAS_H / 2;
    ctx.fillStyle = '#07160c'; ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, cy + 90, CANVAS_W, CANVAS_H - cy - 90);
    // bubbling slime pit
    for (var b = 0; b < 14; b++) {
      var bb = Math.abs(Math.sin(p * 18 + b * 1.7));
      ctx.fillStyle = 'rgba(46,204,64,' + (0.2 + bb * 0.4) + ')';
      ctx.beginPath(); ctx.arc(cx - 90 + ((p * 40 + b * 40) % 180), cy + 96 - bb * 8, 3 + bb * 6, 0, Math.PI * 2); ctx.fill();
    }
    // slime king rises out of the pit
    var rise = Math.min(1, p / 0.4);
    ctx.save(); ctx.translate(cx, cy + 92); ctx.scale(0.2 + rise * 1.6, 0.2 + rise * 1.6); drawBossBody(0, 0, 0, 1); ctx.restore();
    // dripping slime from above
    ctx.strokeStyle = 'rgba(46,204,64,0.7)'; ctx.lineWidth = 3;
    for (var d = 0; d < 4; d++) { ctx.beginPath(); ctx.moveTo(cx - 60 + d * 40, 0); ctx.lineTo(cx - 60 + d * 40 + Math.sin(p * 8 + d) * 3, (p * 60 + d * 30) % 90); ctx.stroke(); }
    // pulsing glow
    var gl = 0.5 + 0.5 * Math.sin(p * 10);
    ctx.fillStyle = 'rgba(46,204,64,' + (0.1 + gl * 0.15) + ')'; ctx.beginPath(); ctx.arc(cx, cy + 30, 120 + gl * 20, 0, Math.PI * 2); ctx.fill();
    if (p > 0.85) { ctx.textAlign = 'center'; ctx.fillStyle = '#2ecc40'; ctx.font = 'bold 40px "Courier New", monospace'; ctx.fillText('SLUDGE KING', cx, cy - 40); ctx.textAlign = 'left'; }
    ctx.fillStyle = '#555'; ctx.font = '11px "Courier New", monospace'; ctx.fillText('Press SPACE to skip', CANVAS_W / 2 - 60, CANVAS_H - 10);
  }

  function drawBossCinematic() {
    if (boss.rat || boss.skin === 4) { drawRatCinematic(); return; }
    if (boss.skin === 1) { drawTarCinematic(); return; }
    if (boss.skin === 2) { drawGolemCinematic(); return; }
    if (boss.skin === 3) { drawGobblerCinematic(); return; }
    if (boss.skin === 5) { drawKnightCinematic(); return; }
    if (boss.skin === 6) { drawGunslingerCinematic(); return; }
    if (boss.skin === 7) { drawGhostCinematic(); return; }
    if (boss.skin === 8) { drawTankCinematic(); return; }
    if (boss.skin === 9) { drawLaserCinematic(); return; }
    drawSludgeCinematic();
  }

  function drawEnemyIntro() {
    if (introEnemies.length === 0) return;
    var type = introEnemies[introIndex].type;
    if (type === 'boss') { try { drawBossCinematic(); } catch (e) { console.error('[Cinematic] failed, skipping intro:', e); state = 'playing'; introTimer = 0; } }
    else drawEnemyShot(type);
  }

  function drawOverlays() {
    if (deathTimer > 0) { ctx.fillStyle = 'rgba(255,0,0,' + (deathTimer / 10) * 0.35 + ')'; ctx.fillRect(0, 0, CANVAS_W, CANVAS_H); }
    if (state === 'enemyintro') drawEnemyIntro();
    if (state === 'levelclear') {
      ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, 0, CANVAS_W, CANVAS_H); ctx.textAlign = 'center';
      ctx.fillStyle = '#ffd42a'; ctx.fillRect(CANVAS_W / 2 - 260, 170, 520, 130);
      ctx.fillStyle = '#3a2c00'; ctx.font = 'bold 34px "Courier New", monospace'; ctx.fillText(isBossLevel() ? 'BOSS DEFEATED!' : 'LEVEL COMPLETE!', CANVAS_W / 2, 218);
      ctx.fillStyle = '#0a4d14'; ctx.font = 'bold 20px "Courier New", monospace'; ctx.fillText('Press SPACE to continue', CANVAS_W / 2, 262);
      ctx.textAlign = 'left';
    } else if (state === 'victory') { drawVictoryTrophy(); drawMenu('YOU WIN!', ['PLAY AGAIN', 'TITLE SCREEN']); }
    else if (state === 'gameover') drawMenu('GAME OVER', ['TRY AGAIN', 'TITLE SCREEN']);
  }

  function drawScanlines() { ctx.fillStyle = 'rgba(0,0,0,0.08)'; for (var y = 0; y < CANVAS_H; y += 3) ctx.fillRect(0, y, CANVAS_W, 1); }

  // ============================================================
  //  MAIN LOOP
  // ============================================================
  var lastTime = 0, accumulator = 0, FRAME = 1000 / 60;
  function gameLoop(timestamp) {
    if (lastTime === 0) lastTime = timestamp;
    var delta = timestamp - lastTime; lastTime = timestamp;
    accumulator += Math.min(delta, 100);
    while (accumulator >= FRAME) { update(); accumulator -= FRAME; }
    render();
    requestAnimationFrame(gameLoop);
  }

  // ============================================================
  //  AUTOMATED BUG SWEEP (runs every SWEEP_INTERVAL frames)
  //  Validates core game-state invariants and self-heals anything
  //  that can be repaired safely (NaN/out-of-bounds values, stuck
  //  audio, timers, grid, etc). Reports results to the console.
  // ============================================================
  function bugSweepNote(list, msg) { list.push(msg); }
  function runBugSweep() {
    var fixed = [];
    var P = player;
    if (P) {
      if (!isFinite(P.x) || !isFinite(P.y)) {
        P.x = P.respawn ? P.respawn.x : TS; P.y = P.respawn ? P.respawn.y : 0; P.vx = 0; P.vy = 0;
        bugSweepNote(fixed, 'player position was NaN -> respawned');
      }
      if (!isFinite(P.vx) || !isFinite(P.vy)) { P.vx = 0; P.vy = 0; bugSweepNote(fixed, 'player velocity was NaN -> zeroed'); }
      var maxX = levelW * TS - P.w, maxY = levelH * TS;
      if (P.x < -TS || P.x > maxX + TS) { P.x = clamp(P.x, 0, Math.max(0, maxX)); bugSweepNote(fixed, 'player X out of bounds -> clamped'); }
      if (P.y < -TS || P.y > maxY + TS) { P.y = clamp(P.y, 0, Math.max(0, maxY - P.h)); P.vy = 0; bugSweepNote(fixed, 'player Y out of bounds -> clamped'); }
      var pt = ['speedTimer', 'doubleTimer', 'shieldTimer', 'magnetTimer', 'gliderTimer', 'stompTimer', 'slowTimer'];
      for (var pi = 0; pi < pt.length; pi++) if (P[pt[pi]] < 0) { P[pt[pi]] = 0; bugSweepNote(fixed, 'negative ' + pt[pi] + ' -> 0'); }
    }
    if (starTimer < 0) { starTimer = 0; bugSweepNote(fixed, 'negative starTimer -> 0'); }
    if (invulnTimer < 0) { invulnTimer = 0; bugSweepNote(fixed, 'negative invulnTimer -> 0'); }
    if (deathTimer < 0) { deathTimer = 0; bugSweepNote(fixed, 'negative deathTimer -> 0'); }
    for (var i = enemies.length - 1; i >= 0; i--) {
      var e = enemies[i];
      if (!isFinite(e.x) || !isFinite(e.y)) { enemies.splice(i, 1); bugSweepNote(fixed, 'removed enemy with NaN position'); continue; }
      if (typeof e.hp === 'number' && e.hp < 0) { e.hp = 0; bugSweepNote(fixed, 'enemy hp < 0 -> 0'); }
    }
    if (boss && boss.alive) {
      if (!isFinite(boss.x) || !isFinite(boss.y)) {
        boss.x = Math.floor(levelW / 2) * TS; boss.y = surfaceRow() * TS - boss.h;
        bugSweepNote(fixed, 'boss position was NaN -> reset');
      }
      if (boss.hp < 0) { boss.hp = 0; bugSweepNote(fixed, 'boss hp < 0 -> 0'); }
      if (boss.hp > boss.maxHp) { boss.hp = boss.maxHp; bugSweepNote(fixed, 'boss hp > max -> clamped'); }
    }
    if (!isFinite(camX) || !isFinite(camY)) { camX = 0; camY = 0; bugSweepNote(fixed, 'camera was NaN -> reset'); }
    if (grid.length !== levelH || (grid[0] && grid[0].length !== levelW)) { buildGrid(levelIndex); bugSweepNote(fixed, 'grid dimensions mismatched -> rebuilt'); }
    if (state === 'playing' && !settings.muted && music.theme && !music.playing) {
      playMusic(music.theme); bugSweepNote(fixed, 'music had stopped while playing -> resumed');
    }
    if (fixed.length) {
      bugFixTotal += fixed.length;
      bugLog.push({ t: spikeTimer, fixes: fixed.slice() });
      if (bugLog.length > 20) bugLog.shift();
      sweepToast = 210;
      console.log('[BugSweep] fixed ' + fixed.length + ' issue(s): ' + fixed.join('; '));
    } else {
      console.log('[BugSweep] no issues found (checks passed)');
    }
  }

  function update() {
    sweepTimer++;
    if (sweepTimer >= SWEEP_INTERVAL) { sweepTimer = 0; runBugSweep(); }
    if (sweepToast > 0) sweepToast--;
    if (state === 'title') { spikeTimer++; updateTitleDemo(); return; }
    if (state === 'pause') { spikeTimer++; return; }
    if (starTimer > 0) starTimer--;
    if (invulnTimer > 0) invulnTimer--;
    if (deathTimer > 0) deathTimer--;
    if (player.speedTimer > 0) player.speedTimer--;
    if (player.doubleTimer > 0) player.doubleTimer--;
    if (player.shieldTimer > 0) player.shieldTimer--;
    if (player.magnetTimer > 0) player.magnetTimer--;
    if (player.gliderTimer > 0) player.gliderTimer--;
    if (player.copperTimer > 0) player.copperTimer--;
    spikeTimer++;

    if (state === 'enemyintro') {
      if (!isFinite(introTimer)) introTimer = 0;
      if (introTimer > 0) introTimer--;
      if (introTimer <= 0) {
        introIndex++;
        if (introIndex < introEnemies.length) introTimer = introDuration(introIndex);
        else state = 'playing';
      }
      return;
    }
    if (state === 'playing') {
      applyMagnet();
      applyCopperConduit();
      updatePlayer(); updatePlatforms(); updateEnemies(); updateBoss(); updateTarPillars(); updateProjectiles(); updatePuddles(); updateDrops(); spawnFromGenerators(); updateCamera();
      updatePopups();
    }
  }

  function applyBrightness() {
    if (settings.brightness !== 1) {
      var ba = settings.brightness < 1 ? (1 - settings.brightness) : (settings.brightness - 1);
      ctx.fillStyle = settings.brightness < 1 ? 'rgba(0,0,0,' + ba + ')' : 'rgba(255,255,255,' + (ba * 0.6) + ')';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    }
  }
  // Level 30 (GUNSLINGER) western-town ambience: tumbleweeds, birds, heat shimmer, town lights.
  function drawWesternAmbient() {
    if (!(LEVELS[levelIndex].boss && LEVELS[levelIndex].boss.skin === 6)) return;
    var t = spikeTimer;
    // big western sun with heat-haze glow + rays
    var sunX = CANVAS_W * 0.72, sunY = CANVAS_H * 0.28;
    var sp = 0.5 + 0.5 * Math.sin(t * 0.02);
    ctx.fillStyle = 'rgba(255,180,80,0.55)'; ctx.beginPath(); ctx.arc(sunX, sunY, 30 + sp * 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,200,120,0.25)'; ctx.beginPath(); ctx.arc(sunX, sunY, 46 + sp * 8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,190,100,0.12)'; ctx.lineWidth = 3;
    for (var rr = 0; rr < 8; rr++) { var ra = rr * Math.PI / 4 + t * 0.001; ctx.beginPath(); ctx.moveTo(sunX + Math.cos(ra) * 34, sunY + Math.sin(ra) * 34); ctx.lineTo(sunX + Math.cos(ra) * 52, sunY + Math.sin(ra) * 52); ctx.stroke(); }
    // rising heat-shimmer dust
    for (var m = 0; m < 16; m++) {
      var mx = (m * 89 + Math.sin(m) * 30) % CANVAS_W;
      var my = CANVAS_H - ((t * (0.4 + (m % 4) * 0.1) + m * 90) % (CANVAS_H * 0.6));
      ctx.fillStyle = 'rgba(190,160,100,' + (0.05 + 0.08 * Math.abs(Math.sin(m + t / 30))) + ')';
      ctx.fillRect(mx, my, 2, 2);
    }
    // rolling tumbleweed (crosses every ~9s)
    if ((t % 560) < 500) {
      var tw = (t % 560) / 500;
      var twx = tw * (CANVAS_W + 120) - 60;
      var twy = CANVAS_H - 42 - Math.abs(Math.sin(t * 0.12)) * 26;
      ctx.save(); ctx.translate(twx, twy); ctx.rotate(t * 0.4);
      ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 3;
      for (var w1 = 0; w1 < 8; w1++) { var a = w1 * Math.PI / 4; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 11, Math.sin(a) * 11); ctx.stroke(); }
      ctx.fillStyle = 'rgba(107,74,42,0.25)'; ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    // birds drifting across the sky
    for (var b = 0; b < 3; b++) {
      var bp = ((t * 0.5 + b * 320) % (CANVAS_W + 160)) - 80;
      var by = 44 + b * 26 + Math.sin(t * 0.08 + b) * 8;
      var flap = Math.sin(t * 0.6 + b) * 3;
      ctx.fillStyle = 'rgba(20,14,8,0.75)';
      ctx.beginPath(); ctx.moveTo(bp - 6, by); ctx.lineTo(bp - flap, by - 3); ctx.lineTo(bp, by); ctx.lineTo(bp + flap, by - 3); ctx.lineTo(bp + 6, by); ctx.closePath(); ctx.fill();
    }
    // flickering distant town window lights along the horizon
    for (var wl = 0; wl < 6; wl++) {
      var wlx = (wl * 130 + 30) % CANVAS_W;
      var wly = CANVAS_H - 18 - (wl % 3) * 14;
      var fg = 0.12 + 0.3 * Math.abs(Math.sin(t * 0.05 + wl * 2.2));
      ctx.fillStyle = 'rgba(255,190,70,' + fg + ')'; ctx.fillRect(wlx, wly, 7, 7);
      ctx.fillStyle = 'rgba(255,190,70,' + fg * 0.4 + ')'; ctx.fillRect(wlx - 3, wly - 3, 13, 13);
    }
  }

  function render() {
    if (state === 'title') { drawTitle(); drawScanlines(); applyBrightness(); return; }
    drawBackground();
    drawWesternAmbient();
    ctx.save(); ctx.translate(-camX, -camY);
    var x0 = Math.floor(camX / TS), x1 = Math.ceil((camX + CANVAS_W) / TS);
    var y0 = Math.floor(camY / TS), y1 = Math.ceil((camY + CANVAS_H) / TS);
    for (var ty = y0; ty < y1; ty++) for (var tx = x0; tx < x1; tx++) {
      if (tx < 0 || tx >= levelW || ty < 0 || ty >= levelH) continue;
      var tile = grid[ty][tx]; if (tile !== EMPTY) drawTile(tx, ty, tile);
    }
    for (var i = 0; i < platforms.length; i++) drawPlatform(platforms[i]);
    drawBoss();
    drawTarPillars();
    drawPuddles();
    drawDrops();
    for (var j = 0; j < projectiles.length; j++) drawProjectile(projectiles[j]);
    for (var k = 0; k < enemies.length; k++) drawEnemy(enemies[k]);
    drawPlayer();
    ctx.restore();
    drawHUD();
    drawPopups();
    if (state === 'pause') drawMenu('PAUSED', ['RESUME', 'RESTART LEVEL', 'QUIT TO TITLE']);
    drawOverlays();
    drawScanlines();
    applyBrightness();
  }

  requestAnimationFrame(gameLoop);
  window.gloopBugSweep = runBugSweep;
  window.gloopStartCustom = startCustomGame;
})();
</script>
</body>
</html>
