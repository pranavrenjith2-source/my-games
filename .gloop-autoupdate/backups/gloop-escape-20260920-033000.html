    { step: 0.16, wave: 'sine',    melody: [233,220,233,247,220,196,220,0,233,220,233,247,262,233,220,0], bass: [116,110,116,98,116,110,98,82] }, // GLOOP GOBBLER
    { step: 0.10, wave: 'sawtooth',melody: [262,294,311,294,262,294,311,392,311,294,262,233,220,233,262,0], bass: [131,131,147,131,98,98,110,98] },// GIANT RAT
    { step: 0.14, wave: 'square',  melody: [262,330,392,330,392,440,392,330,262,330,392,523,392,330,262,0], bass: [131,131,165,131,131,131,98,131] }, // SWORD KNIGHT
    { step: 0.14, wave: 'triangle',melody: [294,294,392,294,262,294,330,392,294,294,392,294,262,294,262,0], bass: [147,147,196,147,131,131,147,131] }, // GUNSLINGER
    { step: 0.18, wave: 'sine',    melody: [262,0,233,0,220,0,196,0,220,0,233,0,262,0,233,0], bass: [131,0,110,0,98,0,110,0] },                   // GHOST WRAITH
    { step: 0.12, wave: 'square',  melody: [110,110,0,110,131,0,110,0,98,98,0,98,131,0,110,0], bass: [55,55,65,55,49,49,65,55] },                // SPIKED TANK
    { step: 0.11, wave: 'sawtooth',melody: [440,440,0,440,523,0,440,0,392,392,0,392,440,0,523,0], bass: [220,220,196,220,220,220,147,196] }       // LASER BOT
  ];
  function musicNote(freq, t, dur, type, vol) {
    if (!music.ctx) return;
    var o = music.ctx.createOscillator(), g = music.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(Math.max(1, freq), t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.14, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(music.master); o.start(t); o.stop(t + dur + 0.05);
  }
  function musicSchedule() {
    if (!music.playing || !music.ctx || !music.theme) return;
    var theme = music.theme, t = music.ctx.currentTime;
    while (music.nextTime < t + 0.25) {
      var i = music.index % theme.melody.length;
      var step = theme.step;
      if (theme.melody[i]) musicNote(theme.melody[i], music.nextTime, step * 0.9, theme.wave, 0.12);
      if (i % 2 === 0 && theme.bass[i % theme.bass.length]) musicNote(theme.bass[i % theme.bass.length], music.nextTime, step * 1.8, 'triangle', 0.18);
      music.nextTime += step; music.index++;
    }
  }
  function setMuted(m) { settings.muted = m; if (music.master) music.master.gain.value = m ? 0 : 0.45; }
  function doPause() {
    if (state !== 'playing') return;
    sfx('pause');         // pause blip first
    stopMusic();          // fully stop the music (keeps the audio context clean)
    state = 'pause'; menuIndex = 0;
  }
  function doResume() {
    if (state !== 'pause') return;
    ensureAudio();        // make sure the audio context is running again
    if (music.theme) playMusic(music.theme); // resume the same theme
    sfx('resume');        // resume blip
    state = 'playing';
  }
  function playMusic(theme) {
    ensureAudio();
    if (!audioCtx) { pendingTheme = theme; return; }
    startMusic(theme);
  }
  function startMusic(theme) {
    if (!audioCtx) return;
    if (!music.ctx) { music.ctx = audioCtx; music.master = audioCtx.createGain(); music.master.gain.value = settings.muted ? 0 : 0.45; music.master.connect(audioCtx.destination); }
    music.theme = theme; music.playing = true; music.nextTime = audioCtx.currentTime + 0.05; music.index = 0;
    if (!music.timer) music.timer = setInterval(musicSchedule, 25);
  }
  function stopMusic() { music.playing = false; if (music.timer) { clearInterval(music.timer); music.timer = null; } }
  function muteMusic() { if (music.master) music.master.gain.value = 0; }
  function unmuteMusic() { if (music.master) music.master.gain.value = 0.45; }

  // ============================================================
  //  TILE HELPERS
  // ============================================================
  function isSolid(tile) { return tile === GROUND || tile === BRICK || tile === SPRING || tile === CRATE || tile === ICE || tile === CONV_R || tile === CONV_L || tile === BOUNCY || tile === TRAMPOLINE; }
  function solidSide(tile) { return isSolid(tile) || tile === ONEWAY; }
  function tileAt(px, py) {
    var tx = Math.floor(px / TS), ty = Math.floor(py / TS);
    if (tx < 0 || tx >= levelW || ty < 0 || ty >= levelH) return EMPTY;
    return grid[ty][tx];
  }
  function spikeHeight() { var phase = (spikeTimer % SPIKE_PERIOD) / SPIKE_PERIOD; return phase < 0.5 ? phase * 2 : (1 - phase) * 2; }
  function spikeActive() { return spikeHeight() > SPIKE_ACTIVE; }

  // ============================================================
  //  COLLISION
  // ============================================================
  function horizontalCollide(obj) {
    var left = Math.floor(obj.x / TS), right = Math.floor((obj.x + obj.w - 1) / TS);
    var top = Math.floor(obj.y / TS), bottom = Math.floor((obj.y + obj.h - 1) / TS);
    for (var ty = top; ty <= bottom; ty++) {
      var tr = tileAt(right * TS, ty * TS), tl = tileAt(left * TS, ty * TS);
      if (obj.vx > 0 && solidSide(tr)) { obj.x = right * TS - obj.w - 0.01; obj.vx = 0; }
      else if (obj.vx < 0 && solidSide(tl)) { obj.x = (left + 1) * TS + 0.01; obj.vx = 0; }
    }
  }
  function verticalCollide(obj, useSpring) {
    var left = Math.floor(obj.x / TS), right = Math.floor((obj.x + obj.w - 1) / TS);
    var top = Math.floor(obj.y / TS), bottom = Math.floor((obj.y + obj.h - 1) / TS);
    var spring = false;
    for (var tx = left; tx <= right; tx++) {
      var tt = tileAt(tx * TS, top * TS), tb = tileAt(tx * TS, bottom * TS);
      // landing: solid from below OR a one-way platform (only when falling)
      if (obj.vy > 0 && (isSolid(tb) || tb === ONEWAY)) {
        obj.y = bottom * TS - obj.h - 0.01;
        if (tb === SPRING) { if (obj === player) sfx('spring'); obj.vy = SPRING_VY; obj.onGround = false; }
        else if (useSpring && tb === BOUNCY) { if (obj === player) sfx('spring'); obj.vy = -19; obj.onGround = false; }
        else if (useSpring && tb === TRAMPOLINE) { if (obj === player) sfx('spring'); obj.vy = -28; obj.onGround = false; }
        else if (useSpring && tb === CRATE) { grid[Math.floor((obj.y + obj.h - 0.01) / TS)][tx] = EMPTY; obj.vy = 1; }
        else { obj.vy = 0; obj.onGround = true; }
      } else if (obj.vy < 0 && isSolid(tt)) {
        obj.y = (top + 1) * TS + 0.01; obj.vy = 0;
      }
    }
  }

  // ============================================================
  //  PLAYER
  // ============================================================
  function effectiveSpeed() { var s = player.speedTimer > 0 ? MOVE_SPEED * 1.5 : MOVE_SPEED; if (player.slowTimer > 0) s *= 0.5; return s; }
  function playerLadderCol() {
    var left = Math.floor(player.x / TS), right = Math.floor((player.x + player.w - 1) / TS);
    var top = Math.floor(player.y / TS), bottom = Math.floor((player.y + player.h - 1) / TS);
    for (var ty = top; ty <= bottom; ty++) for (var tx = left; tx <= right; tx++) if (tileAt(tx * TS, ty * TS) === LADDER) return tx;
    return -1;
  }

  function updatePlayer() {
    if (player.stompTimer > 0) player.stompTimer--;
    if (player.slowTimer > 0) player.slowTimer--;
    var move = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) move -= 1;
    if (keys['ArrowRight'] || keys['KeyD']) move += 1;
    var jumpPressed = keys['ArrowUp'] || keys['Space'] || keys['KeyW'];
    var climbUp = keys['ArrowUp'] || keys['KeyW'];
    var climbDown = keys['ArrowDown'] || keys['KeyS'];
    if (player.onGround) player.jumpsUsed = 0;

    var ladderCol = playerLadderCol();
    if (ladderCol >= 0 && (climbUp || climbDown)) climbing = true;
    if (ladderCol < 0) climbing = false;

    // Duck / crouch with Down (or S). Driven purely by input (not onGround,
    // which oscillates each frame) so the state stays stable.
    player.ducking = climbDown && !climbing;
    if (player.ducking) { jumpPressed = false; } // can't jump while crouched

    if (climbing) {
      player.x = ladderCol * TS + (TS - player.w) / 2;
      player.vx = 0; player.vy = 0; player.onGround = false;
      if (climbUp) { var ny = player.y - CLIMB_SPEED; if (!isSolid(tileAt(player.x + player.w / 2, ny))) player.y = ny; }
      if (climbDown) { var ny2 = player.y + CLIMB_SPEED; if (!isSolid(tileAt(player.x + player.w / 2, ny2 + player.h - 1))) player.y = ny2; }
      if (jumpPressed) { climbing = false; player.vy = JUMP_VY; }
      else if (move !== 0) { climbing = false; player.vx = move * effectiveSpeed(); player.onGround = false; }
    } else {
      // Ice: low friction -> keep sliding when no input.
      var tileBelow = tileAt(player.x + player.w / 2, player.y + player.h + 1);
      var onIce = player.onGround && tileBelow === ICE;
      if (move !== 0) player.vx = move * (player.ducking ? effectiveSpeed() * 0.5 : effectiveSpeed());
      else if (!onIce) player.vx = 0;
      // (keep last vx on ice)
      if (move !== 0) player.facing = move;
      player.vy += GRAVITY;
      if (player.vy > MAX_FALL) player.vy = MAX_FALL;
      if (player.onGround) coyote = COYOTE_FRAMES;
      else if (coyote > 0) coyote--;
      if (jumpPressed) jumpBuffer = BUFFER_FRAMES;
      else if (jumpBuffer > 0) jumpBuffer--;
      if (jumpBuffer > 0) {
        if (coyote > 0) { sfx('jump'); player.vy = JUMP_VY; player.onGround = false; coyote = 0; jumpBuffer = 0; player.jumpsUsed = 1; }
        else if (player.jumpsUsed === 1 && player.doubleTimer > 0) { sfx('jump'); player.vy = JUMP_VY; player.onGround = false; jumpBuffer = 0; player.jumpsUsed = 2; }
      }
      // Glide: hold jump in the air to fall slowly.
      if (player.gliderTimer > 0 && jumpPressed && !player.onGround && player.vy > 0) {
        player.vy = GLIDE_FALL;
        player.vx = move * effectiveSpeed() * 0.6;
      }
      player.onGround = false;
      player.x += player.vx; horizontalCollide(player);
      player.y += player.vy; verticalCollide(player, true);
    }
    // Conveyor belts push the player.
    var cv = tileAt(player.x + player.w / 2, player.y + player.h + 1);
    if (cv === CONV_R) player.x += 1.5;
    else if (cv === CONV_L) player.x -= 1.5;
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > levelW * TS) player.x = levelW * TS - player.w;
    if (player.y < 0) player.y = 0;
    if (player.y > levelH * TS) takeDamage();
    checkTileInteractions();
  }

  // Spawn a floating feedback popup (text that rises and fades).
  function addPopup(x, y, text, color) {
    popups.push({ x: x, y: y, text: text, color: color, life: 45 });
  }
  function updatePopups() {
    for (var i = popups.length - 1; i >= 0; i--) {
      var p = popups[i];
      p.life--; p.y -= 0.8;
      if (p.life <= 0) popups.splice(i, 1);
    }
  }

  function findTeleporter(which) {
    for (var r = 0; r < levelH; r++) for (var c = 0; c < levelW; c++) if (grid[r][c] === which) return { x: c * TS, y: r * TS };
    return null;
  }

  function checkTileInteractions() {
    var left = Math.floor(player.x / TS), right = Math.floor((player.x + player.w - 1) / TS);
    var top = Math.floor(player.y / TS), bottom = Math.floor((player.y + player.h - 1) / TS);
    for (var ty = top; ty <= bottom; ty++) for (var tx = left; tx <= right; tx++) {
      var tile = (ty >= 0 && ty < levelH && tx >= 0 && tx < levelW) ? grid[ty][tx] : EMPTY;
      switch (tile) {
        case SPIKE: if (spikeActive()) takeDamage(); return;
        case LAVA: case MINE: takeDamage(); return;
        case COIN: grid[ty][tx] = EMPTY; coinsCollected++; player.score += 10; sfx('coin'); break;
        case HEART: grid[ty][tx] = EMPTY; if (lives < 5) lives++; addPopup(tx * TS, ty * TS, '+1 UP', '#ff8a8a'); sfx('heart'); break;
        case STAR: grid[ty][tx] = EMPTY; starTimer = STAR_DURATION; addPopup(tx * TS, ty * TS, 'STAR!', '#ffd42a'); sfx('invincible'); break;
        case SPEED: grid[ty][tx] = EMPTY; player.speedTimer = SPEED_DURATION; addPopup(tx * TS, ty * TS, 'SPEED!', '#2b7fd4'); sfx('speed'); break;
        case DOUBLE: grid[ty][tx] = EMPTY; player.doubleTimer = DOUBLE_DURATION; addPopup(tx * TS, ty * TS, '2X JUMP!', '#2bd4a0'); sfx('double'); break;
        case KEY: grid[ty][tx] = EMPTY; player.key++; addPopup(tx * TS, ty * TS, 'KEY!', '#ffd42a'); sfx('coin'); break;
        case DOOR: if (player.key > 0) { grid[ty][tx] = EMPTY; player.key--; addPopup(tx * TS, ty * TS, 'DOOR OPEN!', '#ffd42a'); } break;
        case TELEA: { grid[ty][tx] = EMPTY; var d = findTeleporter(TELEB); if (d) { player.x = d.x; player.y = d.y; player.vy = 0; } break; }
        case TELEB: { grid[ty][tx] = EMPTY; var a = findTeleporter(TELEA); if (a) { player.x = a.x; player.y = a.y; player.vy = 0; } break; }
        case CHECKPOINT: if (player.respawn.x !== tx * TS || player.respawn.y !== ty * TS - TS) { player.respawn = { x: tx * TS, y: ty * TS - TS }; addPopup(tx * TS, ty * TS, 'CHECKPOINT!', '#e03e3e'); } break;
        case GEM: grid[ty][tx] = EMPTY; player.score += 50; addPopup(tx * TS, ty * TS, '+50', '#2bd4a0'); sfx('coin'); break;
        case GOLD: grid[ty][tx] = EMPTY; player.score += 100; addPopup(tx * TS, ty * TS, '+100', '#ffd42a'); sfx('coin'); break;
        case SHIELD: grid[ty][tx] = EMPTY; player.shieldTimer = 300; addPopup(tx * TS, ty * TS, 'SHIELD!', '#2b7fd4'); sfx('shield'); break;
        case MAGNET: grid[ty][tx] = EMPTY; player.magnetTimer = 300; addPopup(tx * TS, ty * TS, 'MAGNET!', '#e03e3e'); sfx('magnet'); break;
        case GLIDER: grid[ty][tx] = EMPTY; player.gliderTimer = GLIDER_DURATION; addPopup(tx * TS, ty * TS, 'GLIDE!', '#9bd7ef'); sfx('glider'); break;
        case COPPER: grid[ty][tx] = EMPTY; player.copperTimer = COPPER_DURATION; addPopup(tx * TS, ty * TS, 'COPPER!', '#e08a3e'); sfx('copper'); break;
        case TROPHY: if (!isBossLevel() && coinsCollected >= coinsNeeded) { levelClear(); return; } break;
      }
    }
  }

  // Magnet power-up pulls nearby coins to the player.
  function applyMagnet() {
    if (player.magnetTimer <= 0) return;
    var pr = 5 * TS;
    for (var r = 0; r < levelH; r++) for (var c = 0; c < levelW; c++) {
      if (grid[r][c] === COIN) {
        var cx = c * TS + TS / 2, cy = r * TS + TS / 2;
        var px = player.x + player.w / 2, py = player.y + player.h / 2;
        if (Math.abs(cx - px) < pr && Math.abs(cy - py) < pr) { grid[r][c] = EMPTY; coinsCollected++; player.score += 10; }
      }
    }
  }

  // Copper Conduit power-up: a crackling aura that periodically zaps enemies
  // that wander too close, chipping one hit point per zap.
  function applyCopperConduit() {
    if (player.copperTimer <= 0) return;
    var pr = 2.1 * TS;
    var px = player.x + player.w / 2, py = player.y + player.h / 2;
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (!e.alive || e.hidden) continue;
      if (e.zapTimer > 0) { e.zapTimer--; continue; }
      var dx = (e.x + e.w / 2) - px, dy = (e.y + e.h / 2) - py;
      if (dx * dx + dy * dy < pr * pr) {
        e.zapTimer = 24;
        e.hp = (e.hp || 1) - 1;
        addPopup(e.x, e.y, 'ZAP!', '#e08a3e');
        sfx('copper');
        if (e.hp <= 0) { e.alive = false; player.score += 5; maybeDropCoin(e); enemyDeathSfx(e.type); }
      }
    }
  }

  function takeDamage() {
    if (state !== 'playing') return;
    if (starTimer > 0 || invulnTimer > 0) return;
    if (player.shieldTimer > 0) { player.shieldTimer = 0; invulnTimer = INVULN_DURATION; return; }
    lives--;
    if (lives <= 0) { state = 'gameover'; sfx('death'); sfx('gameover'); stopMusic(); return; }
    sfx('damage');
    invulnTimer = INVULN_DURATION; deathTimer = 10;
    // Respawn at the last checkpoint (or start), keep coins.
    player.x = player.respawn.x; player.y = player.respawn.y; player.vy = 0; player.vx = 0;
    climbing = false;
  }

  function levelClear() { state = (levelIndex >= LEVELS.length - 1) ? 'victory' : 'levelclear'; sfx('levelclear'); }

  // ============================================================
  //  ENEMIES
  // ============================================================
  function updateEnemies() {
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (!e.alive) continue;
      if (e.type === 'chaser') updateChaser(e);
      else if (e.type === 'cannon') updateCannon(e);
      else if (e.type === 'fireball') updateFireball(e);
      else if (e.type === 'ghost') updateGhost(e);
      else if (e.type === 'mole') updateMole(e);
      else if (e.type === 'flyer') updateFlyer(e);
      else if (e.type === 'miniboss') updateMiniboss(e);
      else updateGroundEnemy(e);
      checkEnemyPlayerCollision(e);
    }
  }

  function updateFireball(e) {
    e.vy += GRAVITY; if (e.vy > MAX_FALL) e.vy = MAX_FALL;
    var ahead = e.dir > 0 ? e.x + e.w + 1 : e.x - 1;
    if (solidSide(tileAt(ahead, e.y + e.h / 2))) e.dir *= -1;
    e.x += e.dir * e.speed;
    e.onGround = false; e.y += e.vy; verticalCollide(e, false);
    if (e.onGround) { e.vy = -13; }
  }

  function updateGhost(e) {
    e.time += 0.05;
    var dx = player.x - e.x, dy = player.y - e.y;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    e.x += dx / len * e.speed; e.y += dy / len * e.speed;
    e.dir = dx > 0 ? 1 : -1;
    if (e.x < 0) e.x = 0; if (e.x + e.w > levelW * TS) e.x = levelW * TS - e.w;
    if (e.y < 0) e.y = 0; if (e.y + e.h > levelH * TS) e.y = levelH * TS - e.h;
  }

  function updateMole(e) {
    e.popTimer++;
    e.hidden = (e.popTimer % 100) > 60;
  }

  function updateFlyer(e) {
    e.time += 0.05;
    e.y = e.baseY + Math.sin(e.time) * 40;
    e.dir = player.x > e.x ? 1 : -1;
    e.x += e.dir * e.speed * 0.3;
    if (e.x < 0) e.x = 0; if (e.x + e.w > levelW * TS) e.x = levelW * TS - e.w;
  }

  function updateGroundEnemy(e) {
    e.time = (e.time || 0) + 0.05;
    e.dir = player.x > e.x ? 1 : -1;
    e.vy += GRAVITY;
    if (e.vy > MAX_FALL) e.vy = MAX_FALL;
    if (e.type === 'hopper' || e.type === 'slime') { if (e.onGround) { if (e.jumpTimer <= 0) { e.vy = -12; e.onGround = false; e.jumpTimer = e.jumpPeriod; } else e.jumpTimer--; } }
    e.vx = e.dir * e.speed;
    e.x += e.vx; horizontalCollide(e);
    e.onGround = false; e.y += e.vy; verticalCollide(e, false);
    var aheadX = e.dir > 0 ? e.x + e.w + 1 : e.x - 1;
    var below = tileAt(aheadX, e.y + e.h + 2);
    var front = tileAt(e.dir > 0 ? e.x + e.w + 1 : e.x - 1, e.y + e.h / 2);
    if (!isSolid(below) || isSolid(front)) e.dir *= -1;
    if (e.x < 0) { e.x = 0; e.dir = 1; }
    if (e.x + e.w > levelW * TS) { e.x = levelW * TS - e.w; e.dir = -1; }
  }

  function updateChaser(e) {
    e.time += 0.06;
    var dir = player.x > e.x ? 1 : -1;
    e.x += dir * e.speed;
    e.y = e.baseY + Math.sin(e.time) * e.amp;
    if (e.x < 0) e.x = 0;
    if (e.x + e.w > levelW * TS) e.x = levelW * TS - e.w;
  }

  function updateCannon(e) {
    e.time = (e.time || 0) + 0.05;
    if (e.recoil > 0) e.recoil--;
    e.fireTimer++;
    if (e.fireTimer > e.fireInterval) {
      e.fireTimer = 0; e.recoil = 8;
      var speed = 2.5;
      var ang = Math.atan2((player.y + player.h / 2) - (e.y + e.h / 2), (player.x + player.w / 2) - (e.x + e.w / 2));
      projectiles.push({ x: e.x + e.w / 2 - 6, y: e.y + e.h / 2 - 6, w: 12, h: 12, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, done: false, from: 'cannon' });
    }
  }

  // Sometimes a killed enemy drops a coin (natural/spawned enemies drop more).
  // Play the correct defeat sound for a given enemy type.
  function enemyDeathSfx(type) {
    var m = { patrol: 'patrol', charger: 'charger', hopper: 'hopper', chaser: 'chaser', cannon: 'cannon', fireball: 'fireball', snake: 'snake', ghost: 'ghost', mole: 'mole', flyer: 'flyer', brute: 'brute' };
    sfx(m[type] || 'stomp');
  }

  function maybeDropCoin(e) {
    var chance = e.spawned ? 0.5 : 0.15;
    if (Math.random() < chance) drops.push({ x: e.x + e.w / 2 - 8, y: e.y, w: 16, h: 16, vy: 0, grounded: false });
  }

  function checkEnemyPlayerCollision(e) {
    if (!e.alive || e.hidden || !aabb(player, e)) return;
    if (starTimer > 0) { e.alive = false; player.vy = JUMP_VY * 0.6; maybeDropCoin(e); enemyDeathSfx(e.type); return; }
    var stomp = (player.y + player.h) < (e.y + e.h * 0.6) && (player.vy > 0 || player.stompTimer > 0);
    if (stomp) {
      player.stompTimer = 8;
      e.hp = (e.hp || 1) - 1;
      if (e.hp <= 0) { e.alive = false; player.vy = JUMP_VY * 0.7; maybeDropCoin(e); enemyDeathSfx(e.type); }
      else { e.hitTimer = 18; player.vy = JUMP_VY * 0.9; }
    }
    else takeDamage();
  }

  // ============================================================
  //  MOVING PLATFORMS
  // ============================================================
  function updatePlatforms() {
    for (var i = 0; i < platforms.length; i++) {
      var p = platforms[i];
      p.prevX = p.px; p.prevY = p.py;
      p.t += p.speed;
      var o = Math.sin(p.t * Math.PI * 2) * p.range / 2;
      if (p.axis === 'x') { p.px = p.baseX + o; p.py = p.baseY; }
      else { p.py = p.baseY + o; p.px = p.baseX; }
      if (state === 'playing') {
        var top = p.py;
        if (player.vy >= 0 && player.x + player.w > p.px && player.x < p.px + p.w && player.y + player.h >= top && player.y + player.h <= top + 16) {
          player.y = top - player.h; player.vy = 0; player.onGround = true; player.jumpsUsed = 0; player.x += p.px - p.prevX;
        }
      }
    }
  }

  // ============================================================
  //  BOSS
  // ============================================================
  function fire(type, x, y, ang, speed) {
    projectiles.push({ type: type, x: x, y: y, w: 14, h: 14, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, done: false, from: 'boss', life: 240 });
  }

  // Unique attack per boss.
  function bossAttack() {
    var bx = boss.x + boss.w / 2, by = boss.y + boss.h / 2;
    var base = Math.atan2((player.y + player.h / 2) - by, (player.x + player.w / 2) - bx);
    var skin = boss.skin;
    if (skin === 0) { // SLUDGE KING: lobs two dripping slime globs
      fire('slime', bx, by - 8, base - 0.2, 2.6);
      fire('slime', bx, by - 8, base + 0.2, 2.6);
    } else if (skin === 1) { // TAR TITAN: tar spread + leaves a tar pool
      for (var i = -1; i <= 1; i++) fire('tar', bx, by, base + i * 0.3, 2.4);
      puddles.push({ type: 'tar', x: boss.x + boss.w / 2 - 40, y: surfaceRow() * TS - 6, w: 80, h: 6, life: 100 });
    } else if (skin === 2) { // GOO GOLEM: hurls rock projectiles
      fire('rock', bx, by - 10, base - 0.15, 3.0);
      fire('rock', bx, by - 10, base + 0.15, 3.0);
    } else if (skin === 3) { // GLOOP GOBBLER: spits a small, slower volley
      fire('spit', bx, by, base - 0.1, 2.4);
      fire('spit', bx, by, base + 0.1, 2.4);
    } else if (skin === 5) { // SWORD KNIGHT: crescent sword waves
      fire('sword', bx, by - 8, base - 0.2, 3.2);
      fire('sword', bx, by - 8, base + 0.2, 3.2);
    } else if (skin === 6) { // GUNSLINGER: fast bullet burst
      for (var g1 = -1; g1 <= 1; g1++) fire('bullet', bx, by - 6, base + g1 * 0.12, 4.6);
    } else if (skin === 7) { // GHOST WRAITH: homing spectral bolts
      fire('spectral', bx, by, base - 0.15, 2.6);
      fire('spectral', bx, by, base + 0.15, 2.6);
    } else if (skin === 8) { // SPIKED TANK: spiked balls
      fire('spike', bx, by - 10, base - 0.2, 2.6);
      fire('spike', bx, by - 10, base + 0.2, 2.6);
    } else if (skin === 9) { // LASER BOT: laser beam + side bolts
      fire('laser', bx, by - 6, base, 4.4);
      fire('bullet', bx, by - 6, base + Math.PI / 2, 3);
      fire('bullet', bx, by - 6, base - Math.PI / 2, 3);
    } else { // fallback volley
      for (var i3 = -2; i3 <= 2; i3++) fire('spit', bx, by, base + i3 * 0.18, 3.2);
    }
  }

  function bossHurt() {
    boss.hp--; boss.hitTimer = 15;
    if (boss.skin === 0) spawnSlimeMinion(); // SLUDGE KING splits off a slime minion when hit
    if (boss.hp <= 0) {
      boss.alive = false; sfx('win');
      if (boss.rat) { state = 'victory'; stopMusic(); } // the giant rat drops the trophy -> you win
      else levelClear();
    } else sfx('bossHit');
  }

  function spawnRatMinion() {
    if (enemies.length >= 14) return;
    var type = Math.random() < 0.5 ? 'patrol' : 'hopper';
    enemies.push({ type: type, x: boss.x + 16, y: surfaceRow() * TS - TS, w: TS, h: TS, vx: 0, vy: 0, dir: player.x > boss.x ? 1 : -1, speed: 1.5, alive: true, onGround: false, time: 0, baseY: surfaceRow() * TS - TS, amp: 0, jumpTimer: 0, jumpPeriod: 60, spawned: true, hp: 1, hitTimer: 0 });
  }
  var ratMiniOrder = [0, 1, 2, 3, 5, 6, 7, 8, 9];
  var ratMiniIdx = 0;
  function spawnRatMiniBoss() {
    if (enemies.length >= 14) return;
    var skin = ratMiniOrder[ratMiniIdx % ratMiniOrder.length]; ratMiniIdx++;
    enemies.push({ type: 'miniboss', skin: skin, x: boss.x + 16, y: surfaceRow() * TS - 44, w: 52, h: 44, vx: 0, vy: 0, dir: 1, speed: 1.7, alive: true, onGround: false, time: 0, baseY: surfaceRow() * TS - 44, hp: 3, hitTimer: 0, fireTimer: 0, fireInterval: 80, spawned: true, charging: false, chargeDir: 1, chargeTimer: 0 });
  }
  function updateMiniboss(e) {
    e.time = (e.time || 0) + 0.05;
    if (e.skin === 2 || e.skin === 5 || e.skin === 8) { // chargers
      if (e.charging) { e.x += e.chargeDir * e.speed * 2; e.chargeTimer--; if (e.chargeTimer <= 0) { e.charging = false; e.chargeTimer = 150; } }
      else { e.dir = player.x > e.x ? 1 : -1; e.x += e.dir * e.speed; e.chargeTimer--; if (e.chargeTimer <= 0) { e.charging = true; e.chargeDir = e.dir; e.chargeTimer = 70; } }
    } else {
      e.dir = player.x > e.x ? 1 : -1;
      e.x += e.dir * e.speed;
    }
    if (e.skin === 7) e.y = e.baseY + Math.sin(e.time * 0.1) * 40;      // ghost floats
    else if (e.skin === 9) e.y = e.baseY + Math.sin(e.time * 0.12) * 14; // laser hovers
    else e.y = e.baseY;
    if (e.x < 0) { e.x = 0; e.dir = 1; }
    if (e.x + e.w > levelW * TS) { e.x = levelW * TS - e.w; e.dir = -1; }
    e.fireTimer++;
    if (e.fireTimer > e.fireInterval) { e.fireTimer = 0; minibossAttack(e); }
  }
  function minibossAttack(e) {
    var bx = e.x + e.w / 2, by = e.y + e.h / 2;
    var base = Math.atan2((player.y + player.h / 2) - by, (player.x + player.w / 2) - bx);
    var skin = e.skin;
    if (skin === 0) { fire('slime', bx, by - 6, base - 0.2, 2.4); fire('slime', bx, by - 6, base + 0.2, 2.4); }
    else if (skin === 1) { for (var i = -1; i <= 1; i++) fire('tar', bx, by, base + i * 0.3, 2.2); }
    else if (skin === 2) { fire('rock', bx, by - 8, base - 0.15, 2.8); fire('rock', bx, by - 8, base + 0.15, 2.8); }
    else if (skin === 3) { fire('spit', bx, by, base - 0.1, 2.2); fire('spit', bx, by, base + 0.1, 2.2); }
    else if (skin === 5) { fire('sword', bx, by - 6, base - 0.2, 3.0); fire('sword', bx, by - 6, base + 0.2, 3.0); }
    else if (skin === 6) { for (var g = -1; g <= 1; g++) fire('bullet', bx, by - 4, base + g * 0.12, 4.2); }
    else if (skin === 7) { fire('spectral', bx, by, base - 0.15, 2.4); fire('spectral', bx, by, base + 0.15, 2.4); }
    else if (skin === 8) { fire('spike', bx, by - 8, base - 0.2, 2.4); fire('spike', bx, by - 8, base + 0.2, 2.4); }
    else if (skin === 9) { fire('laser', bx, by - 4, base, 4.2); }
    else { for (var i2 = -1; i2 <= 1; i2++) fire('spit', bx, by, base + i2 * 0.2, 2.6); }
  }
  function drawMiniboss(e) {
    if (e.hitTimer > 0 && (Math.floor(e.hitTimer / 2) % 2 === 0)) { ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(e.x, e.y, e.w, e.h); return; }
    ctx.save(); ctx.translate(e.x + e.w / 2, e.y + e.h); ctx.scale(0.55, 0.55); drawBossBody(e.skin, 0, 0, 1); ctx.restore();
  }

  function spawnTarPillars() {
    var n = 2 + Math.floor(Math.random() * 2);
    var px = player.x + player.w / 2;
    for (var i = 0; i < n; i++) {
      var x = 60 + Math.random() * (levelW * TS - 140);
      if (Math.abs(x + 16 - px) < 60) x = px + (Math.random() < 0.5 ? -1 : 1) * (90 + Math.random() * 80);
      x = Math.max(10, Math.min(levelW * TS - 50, x));
      tarPillars.push({ x: x, w: 32, timer: 0, total: 100, maxH: 90 + Math.random() * 30 });
    }
  }
  function updateTarPillars() {
    for (var i = tarPillars.length - 1; i >= 0; i--) {
      var p = tarPillars[i];
      p.timer++;
      if (p.timer > p.total) { tarPillars.splice(i, 1); continue; }
      var ph = p.timer / p.total;
      var h = 0;
      if (ph < 0.3) h = ph / 0.3;
      else if (ph < 0.68) h = 1;
      else h = 1 - (ph - 0.68) / 0.32;
      p.h = h * p.maxH;
      if (h > 0.55) {
        var gy = surfaceRow() * TS;
        if (aabb(player, { x: p.x, y: gy - p.h, w: p.w, h: p.h }) && starTimer <= 0 && invulnTimer <= 0) takeDamage();
      }
    }
  }
  function drawTarPillars() {
    var gy = surfaceRow() * TS;
    for (var i = 0; i < tarPillars.length; i++) {
      var p = tarPillars[i];
      if (!p.h || p.h < 2) continue;
      var x = Math.round(p.x), top = Math.round(gy - p.h);
      ctx.fillStyle = '#26262c'; ctx.fillRect(x, top, p.w, p.h);
      ctx.fillStyle = '#383840'; ctx.fillRect(x + 3, top, p.w - 6, p.h);
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(x, top, p.w, 3);
      ctx.fillStyle = '#2e2e34'; ctx.beginPath(); ctx.arc(x + p.w / 2, top, p.w / 2, Math.PI, 0); ctx.fill();
      for (var d = 0; d < 3; d++) { ctx.fillStyle = '#383840'; ctx.fillRect(x + 4 + d * 9, top + 4 + ((spikeTimer + d * 9) % 12), 4, 6); }
    }
  }

  // Hitbox for a boss's manual melee attack (in front of it, or a ground slam).
  function meleeBox(b) {
    var f = b.dir > 0 ? 1 : -1;
    if (b.meleeType === 'slam') return { x: b.x - 40, y: b.y + b.h - 16, w: b.w + 80, h: 16 };
    if (b.meleeType === 'dash') return { x: f > 0 ? b.x + b.w : b.x - 48, y: b.y, w: 48, h: b.h };
    return { x: f > 0 ? b.x + b.w : b.x - 44, y: b.y + 4, w: 44, h: b.h - 8 };
  }

  function updateBoss() {
    if (!boss || !boss.alive) return;
    if (boss.hitTimer > 0) boss.hitTimer--;

    // GIANT RAT: chases and releases enemies (every 1s) + mini-bosses (every 10s).
    if (boss.rat) {
      boss.dir = player.x > boss.x ? 1 : -1;
      boss.x += boss.dir * boss.speed;
      boss.releaseTimer = (boss.releaseTimer || 0) - 1;
      if (boss.releaseTimer <= 0) { boss.releaseTimer = 60; spawnRatMinion(); }
      boss.bossReleaseTimer = (boss.bossReleaseTimer || 0) - 1;
      if (boss.bossReleaseTimer <= 0) { boss.bossReleaseTimer = 300; spawnRatMiniBoss(); }
    } else if (boss.skin === 3) {
    // GLOOP GOBBLER (skin 3): gentle inhale that only pulls when level & a bit away.
      if (boss.suckTimer === undefined) boss.suckTimer = 240;
      boss.suckTimer--;
      if (boss.suckTimer < 45 && boss.suckTimer > 0) {
        var dx = (boss.x + boss.w / 2) - (player.x + player.w / 2);
        var adx = Math.abs(dx);
        var dyv = Math.abs((player.y + player.h / 2) - (boss.y + boss.h / 2));
        // Only pull when the player is roughly level and 120-520px away, so it never drags you into the boss.
        if (adx > 120 && adx < 520 && dyv < 140) player.x += (dx > 0 ? 1 : -1) * Math.min(1.2, adx * 0.003);
      }
      if (boss.suckTimer <= 0) boss.suckTimer = 240;
    } else if (boss.skin === 2 || boss.skin === 5 || boss.skin === 8) {
    // GOLEM/KNIGHT/TANK charge across the arena.
      if (boss.charging) { boss.x += boss.chargeDir * boss.speed * 2.0; boss.chargeTimer--; if (boss.chargeTimer <= 0) { boss.charging = false; boss.chargeTimer = 160; } }
      else { boss.dir = player.x > boss.x ? 1 : -1; boss.x += boss.dir * boss.speed; boss.chargeTimer--; if (boss.chargeTimer <= 0) { boss.charging = true; boss.chargeDir = boss.dir; boss.chargeTimer = 70; } }
    } else if (boss.skin === 9) {
      // LASER BOT: hovers and strafes toward the player on a sine wave
      boss.dir = player.x > boss.x ? 1 : -1;
      boss.x += boss.dir * boss.speed * (0.6 + 0.5 * Math.abs(Math.sin((boss.time || 0) * 0.09)));
    } else {
      boss.dir = player.x > boss.x ? 1 : -1;
      boss.x += boss.dir * boss.speed;
    }

    if (!boss.rat) {
      boss.fireTimer++;
      if (boss.fireTimer > boss.fireInterval) { boss.fireTimer = 0; bossAttack(); }
    }
    // TAR TITAN: randomly erupts tar pillars from the ground to attack.
    if (boss.skin === 1) {
      boss.pillarTimer = (boss.pillarTimer || 0) + 1;
      if (boss.pillarTimer > 80) { boss.pillarTimer = 0; spawnTarPillars(); }
    }

    if (boss.x < 0) { boss.x = 0; boss.dir = 1; boss.chargeDir = 1; }
    if (boss.x + boss.w > levelW * TS) { boss.x = levelW * TS - boss.w; boss.dir = -1; boss.chargeDir = -1; }
    // Ghost wraith flies a lot (big vertical sweep + side drift); laser bot hovers.
    if (boss.skin === 7) {
      boss.y = surfaceRow() * TS - boss.h - 24 + Math.sin((boss.time || 0) * 0.12) * 72;
      boss.x += Math.sin((boss.time || 0) * 0.09) * 0.8;
    }
    else if (boss.skin === 9) boss.y = surfaceRow() * TS - boss.h + Math.sin((boss.time || 0) * 0.12) * 16;
    else boss.y = surfaceRow() * TS - boss.h;

    // Signature special power (unique per boss).
    updateBossPower();

    // Manual (melee) attacks for some bosses: sword swings, slams, tackles, dashes.
    if (boss.meleeType) {
      if (boss.meleeActive > 0) boss.meleeActive--;
      boss.meleeTimer = (boss.meleeTimer || 0) - 1;
      if (boss.meleeTimer <= 0) { boss.meleeTimer = boss.meleeCooldown; boss.meleeActive = boss.meleeDuration; }
      if (boss.meleeActive > 0) {
        var hb = meleeBox(boss);
        if (aabb(player, hb)) { if (starTimer <= 0 && invulnTimer <= 0) takeDamage(); }
      }
    }

    if (aabb(player, boss)) {
      if (boss.hitTimer > 0) return;
      // Some powers make the boss untouchable for a while (knight's shield, wraith's phase, rat's burrow).
      var guarded = (boss.skin === 5 && boss.shieldTimer > 0) || (boss.skin === 7 && boss.shieldTimer > 0) || boss.burrowed;
      if (starTimer > 0) { if (!guarded) { bossHurt(); player.vy = JUMP_VY * 0.5; } return; }
      var stomp = player.vy > 0 && (player.y + player.h) < (boss.y + boss.h * 0.75);
      if (stomp) { if (!guarded) bossHurt(); player.vy = JUMP_VY * 0.9; }
      else takeDamage();
    }
  }

  // ============================================================
  //  BOSS SIGNATURE POWERS (one unique gimmick per boss)
  // ============================================================
  function spawnSlimeMinion() {
    if (enemies.length >= 16) return;
    var sx = clamp(boss.x + (Math.random() < 0.5 ? -20 : boss.w), 0, levelW * TS - TS);
    enemies.push({ type: 'slime', x: sx, y: boss.y, w: TS, h: TS, vx: 0, vy: 0, dir: player.x > boss.x ? 1 : -1, speed: 1.3, alive: true, onGround: false, time: 0, baseY: boss.y, amp: 0, jumpTimer: 0, jumpPeriod: 55, spawned: true, hp: 1, hitTimer: 0 });
  }
  function spawnRockQuake() {
    for (var i = 0; i < 4; i++) {
      var rx = clamp(player.x + (i - 1.5) * 90 + (Math.random() - 0.5) * 40, 10, levelW * TS - 30);
      projectiles.push({ type: 'rock', x: rx, y: -20 - Math.random() * 60, w: 14, h: 14, vx: 0, vy: 2 + Math.random(), done: false, from: 'boss', life: 300 });
    }
    sfx('bossHit');
  }
  function bossGloopSpray() {
    var bx = boss.x + boss.w / 2, by = boss.y + boss.h / 2;
    var base = Math.atan2((player.y + player.h / 2) - by, (player.x + player.w / 2) - bx);
    for (var i = -1; i <= 1; i++) {
      var a = base + i * 0.25;
      projectiles.push({ type: 'gloop', x: bx, y: by, w: 14, h: 14, vx: Math.cos(a) * 2.6, vy: Math.sin(a) * 2.6 - 0.6, done: false, from: 'boss', life: 200 });
    }
  }
  function spawnSpikeNova() {
    var bx = boss.x + boss.w / 2, by = boss.y + boss.h / 2;
    for (var i = 0; i < 8; i++) fire('spike', bx, by, i / 8 * Math.PI * 2, 2.6);
    sfx('bossHit');
  }
  function updateBossPower() {
    var skin = boss.skin;
    if (boss.rat) { // GIANT RAT: burrows underground and erupts next to the player.
      if (boss.burrowed) {
        boss.x += (player.x > boss.x ? 1 : -1) * 3;
        boss.x = clamp(boss.x, 0, levelW * TS - boss.w);
        boss.burrowTimer--;
        if (boss.burrowTimer <= 0) {
          boss.burrowed = false;
          var side = (player.x + player.w / 2) < levelW * TS / 2 ? 1 : -1;
          boss.x = clamp(player.x + side * 90, 0, levelW * TS - boss.w);
          boss.y = surfaceRow() * TS - boss.h;
          boss.burrowTimer = 300;
          sfx('bossHit');
        }
      } else {
        boss.burrowTimer = (boss.burrowTimer || 300) - 1;
        if (boss.burrowTimer <= 0) { boss.burrowed = true; boss.burrowTimer = 70; }
      }
      if (boss.burrowed) boss.y = surfaceRow() * TS + 10;
      return;
    }
    if (skin === 0) { // SLUDGE KING: splitting handled in bossHurt.
      return;
    } else if (skin === 2) { // GOO GOLEM: periodic rock quake from the ceiling.
      boss.powerTimer++;
      if (boss.powerTimer > 170) { boss.powerTimer = 0; spawnRockQuake(); }
    } else if (skin === 3) { // GLOOP GOBBLER: sticky gloop spray that slows the player.
      boss.powerTimer++;
      if (boss.powerTimer > 120) { boss.powerTimer = 0; bossGloopSpray(); }
    } else if (skin === 5) { // SWORD KNIGHT: raises an invulnerable shield.
      if (boss.shieldTimer > 0) boss.shieldTimer--;
      boss.powerTimer++;
      if (boss.powerTimer > 320) { boss.powerTimer = 0; boss.shieldTimer = 120; }
    } else if (skin === 7) { // GHOST WRAITH: phases out and teleports.
      if (boss.shieldTimer > 0) boss.shieldTimer--;
      boss.powerTimer++;
      if (boss.powerTimer > 260) {
        boss.powerTimer = 0; boss.shieldTimer = 90;
        boss.x = 60 + Math.random() * Math.max(1, levelW * TS - 120 - boss.w);
      }
    } else if (skin === 8) { // SPIKED TANK: radial spike nova.
      boss.powerTimer++;
      if (boss.powerTimer > 200) { boss.powerTimer = 0; spawnSpikeNova(); }
    } else if (skin === 9) { // LASER BOT: sweeping rotating laser beam.
      if (boss.beamTimer > 0) { boss.beamTimer--; boss.beamAngle += 0.035; }
      else {
        boss.powerTimer++;
        if (boss.powerTimer > 300) {
          boss.powerTimer = 0; boss.beamTimer = 150;
          boss.beamAngle = Math.atan2((player.y + player.h / 2) - (boss.y + boss.h / 2), (player.x + player.w / 2) - (boss.x + boss.w / 2));
        }
      }
      if (boss.beamTimer > 0) {
        var bx = boss.x + boss.w / 2, by = boss.y + boss.h / 2;
        var dx = (player.x + player.w / 2) - bx, dy = (player.y + player.h / 2) - by;
        var along = dx * Math.cos(boss.beamAngle) + dy * Math.sin(boss.beamAngle);
        var perp = Math.abs(-dx * Math.sin(boss.beamAngle) + dy * Math.cos(boss.beamAngle));
        if (along > 0 && perp < 12 && starTimer <= 0 && invulnTimer <= 0) takeDamage();
      }
    }
  }

  // The player's effective collision box; shrinks when ducking (for dodging shots).
  function playerBox() {
    if (!player.ducking) return { x: player.x, y: player.y, w: player.w, h: player.h };
    var dh = TS - DUCK_H;
    return { x: player.x, y: player.y + dh, w: player.w, h: DUCK_H };
  }

  function updateProjectiles() {
    for (var i = projectiles.length - 1; i >= 0; i--) {
      var p = projectiles[i];
      // Gravity arcs for slime and rock projectiles.
      if (p.type === 'slime' || p.type === 'rock' || p.type === 'gloop') p.vy += 0.15;
      if (p.type === 'spectral') { // homing bolt
        var ha = Math.atan2((player.y + player.h / 2) - (p.y + 7), (player.x + player.w / 2) - (p.x + 7));
        p.vx += (Math.cos(ha) * 2.6 - p.vx) * 0.08;
        p.vy += (Math.sin(ha) * 2.6 - p.vy) * 0.08;
      }
      if (p.type === 'spike') { // spiked ball bounces
        p.vy += 0.12;
        if (p.y + p.h > surfaceRow() * TS) { p.y = surfaceRow() * TS - p.h; p.vy *= -0.6; }
      }
      p.x += p.vx; p.y += p.vy;
      p.life--;
      // GUNSLINGER bullets ricochet off the ground and arena walls.
      if (p.type === 'bullet') {
        p.bounces = p.bounces || 0;
        if (p.y + p.h > surfaceRow() * TS && p.vy > 0) { p.y = surfaceRow() * TS - p.h; p.vy = -Math.abs(p.vy); p.bounces++; }

      ctx.fillStyle = '#555'; ctx.fillRect(0, -3, 16, 5); ctx.fillRect(12, -4, 4, 8);

      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-8, -31, 2, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(8, -31, 2, 0, Math.PI * 2); ctx.fill();
      // mouth

    } else if (skin === 8) { // SPIKED TANK - armored spiked tank

      ctx.save(); ctx.translate(0, lb); ctx.rotate(sway);

  function drawBoss() {
    if (!boss || !boss.alive) return;
    var x = Math.round(boss.x), y = Math.round(boss.y);
    if (boss.hitTimer > 0 && (Math.floor(boss.hitTimer / 2) % 2 === 0)) return;
    // wobble effect
    boss.time = (boss.time || 0) + 0.08;
    // GIANT RAT burrowed: show a dirt mound instead of the body.
    if (boss.burrowed) {
      ctx.fillStyle = '#3a2410'; ctx.beginPath(); ctx.arc(x + boss.w / 2, surfaceRow() * TS - 4, boss.w * 0.5, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#5a3a1a'; ctx.beginPath(); ctx.arc(x + boss.w / 2, surfaceRow() * TS - 4, boss.w * 0.34, Math.PI, 0); ctx.fill();
      return;
    }
    // GHOST WRAITH phases translucent while teleporting.
    if (boss.skin === 7 && boss.shieldTimer > 0) ctx.globalAlpha = 0.3;
    // Feet align to the bottom of the hitbox (the ground line). The rat faces its direction.
    if (boss.skin === 4) { ctx.save(); ctx.translate(x + boss.w / 2, y + boss.h); ctx.scale(boss.dir > 0 ? 1 : -1, 1); drawBossBody(4, 0, 0, 1); ctx.restore(); }
    else drawBossBody(boss.skin, x + boss.w / 2, y + boss.h, 1);
    ctx.globalAlpha = 1;
    // charge dust
    if (boss.attack === 'charge' && boss.charging) {
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      for (var i = 0; i < 5; i++) ctx.fillRect(x + 4 + ((boss.chargeTimer + i * 7) % 40) * (boss.chargeDir), y + boss.h - 6 - (i % 3) * 6, 5, 5);
    }
    // Manual melee attack visuals.
    if (boss.meleeActive > 0) {
      var f = boss.dir > 0 ? 1 : -1, mx = x + boss.w / 2, my = y + boss.h / 2;
      var aa = 1 - boss.meleeActive / (boss.meleeDuration || 1);
      if (boss.meleeType === 'swing') { // sword arc
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.beginPath(); ctx.arc(mx + f * 10, my, 44, f > 0 ? -Math.PI / 2 : Math.PI / 2, f > 0 ? Math.PI / 2 : -Math.PI / 2); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.3 + aa * 0.6) + ')'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(mx + f * 10, my, 44, f > 0 ? -Math.PI / 2 : Math.PI / 2, f > 0 ? Math.PI / 2 : -Math.PI / 2); ctx.stroke();
      } else if (boss.meleeType === 'slam') { // ground shockwave
        ctx.strokeStyle = 'rgba(255,220,160,' + (0.4 + aa * 0.5) + ')'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(mx, y + boss.h - 4, (1 - aa) * 60 + 10, 0, Math.PI * 2); ctx.stroke();
      } else if (boss.meleeType === 'tackle') { // motion streaks
        ctx.strokeStyle = 'rgba(46,204,64,' + (0.3 + aa * 0.5) + ')'; ctx.lineWidth = 3;
        for (var s2 = 0; s2 < 4; s2++) { ctx.beginPath(); ctx.moveTo(mx - f * (20 + s2 * 10), my); ctx.lineTo(mx - f * (32 + s2 * 10), my + (s2 % 2 ? 6 : -6)); ctx.stroke(); }
      } else if (boss.meleeType === 'dash') { // spectral trail
        ctx.fillStyle = 'rgba(43,212,255,' + (0.2 + aa * 0.4) + ')';
        ctx.beginPath(); ctx.arc(mx - f * 24, my, 18 + aa * 8, 0, Math.PI * 2); ctx.fill();
      }
    }
    // SWORD KNIGHT: shimmering shield bubble.
    if (boss.skin === 5 && boss.shieldTimer > 0) {
      var sx = x + boss.w / 2, sy = y + boss.h / 2, sr = boss.w * 0.72;
      ctx.fillStyle = 'rgba(160,200,255,0.12)'; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(180,215,255,0.85)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(sx, sy, sr - 5, 0, Math.PI * 2); ctx.stroke();
    }
    // LASER BOT: sweeping rotating laser beam.
    if (boss.skin === 9 && boss.beamTimer > 0) {
      var lbx = x + boss.w / 2, lby = y + boss.h / 2;
      var lf = 0.6 + 0.4 * Math.abs(Math.sin(spikeTimer * 0.5));
      ctx.save(); ctx.translate(lbx, lby); ctx.rotate(boss.beamAngle);
      ctx.fillStyle = 'rgba(255,58,43,' + (0.3 * lf) + ')'; ctx.fillRect(0, -12, CANVAS_W, 24);
      ctx.fillStyle = 'rgba(255,58,43,' + (0.7 * lf) + ')'; ctx.fillRect(0, -5, CANVAS_W, 10);
      ctx.fillStyle = 'rgba(255,255,255,' + (0.85 * lf) + ')'; ctx.fillRect(0, -2, CANVAS_W, 4);
      ctx.restore();
      ctx.fillStyle = 'rgba(255,120,60,0.6)'; ctx.beginPath(); ctx.arc(lbx, lby, 10 + lf * 4, 0, Math.PI * 2); ctx.fill();
    }
    // GHOST WRAITH: teleport wisps.
    if (boss.skin === 7 && boss.shieldTimer > 0) {
      for (var wp = 0; wp < 5; wp++) {
        var wa = wp / 5 * Math.PI * 2 + spikeTimer * 0.06;
        ctx.fillStyle = 'rgba(43,212,255,0.5)';
        ctx.beginPath(); ctx.arc(x + boss.w / 2 + Math.cos(wa) * 40, y + boss.h / 2 + Math.sin(wa) * 30, 4, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function drawDrops() {
    for (var i = 0; i < drops.length; i++) {
      var d = drops[i];
      var bob = d.grounded ? Math.sin(spikeTimer / 8) * 2 : 0;
      var cxx = d.x + 8, cyy = d.y + 8 + bob;
      ctx.fillStyle = '#ffd42a'; ctx.beginPath(); ctx.arc(cxx, cyy, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffec8a'; ctx.beginPath(); ctx.arc(cxx, cyy, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#c9a000'; ctx.beginPath(); ctx.arc(cxx, cyy, 2, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawPuddles() {
    for (var i = 0; i < puddles.length; i++) {
      var q = puddles[i];
      ctx.globalAlpha = Math.min(1, q.life / 40);
      ctx.fillStyle = q.type === 'tar' ? '#3a3a40' : (q.type === 'gloop' ? '#2ecc40' : '#1e7a3a');
      fillEllipse(q.x + q.w / 2, q.y + q.h / 2, q.w / 2, q.h / 2);
      ctx.globalAlpha = 1;
    }
  }

  function drawProjectile(p) {
    var x = Math.round(p.x), y = Math.round(p.y), c = x + 7, cy = y + 7;
    if (p.type === 'slime') {
      ctx.fillStyle = '#1e7a3a'; ctx.beginPath(); ctx.arc(c, cy, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2ecc40'; ctx.beginPath(); ctx.arc(c - 2, cy - 2, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3aff5a'; ctx.beginPath(); ctx.arc(c - 3, cy - 3, 2, 0, Math.PI * 2); ctx.fill();
    } else if (p.type === 'tar') {
      ctx.fillStyle = '#1a1a20'; ctx.beginPath(); ctx.arc(c, cy, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3a3a46'; ctx.beginPath(); ctx.arc(c - 2, cy - 2, 4, 0, Math.PI * 2); ctx.fill();
    } else if (p.type === 'rock') {
      ctx.fillStyle = '#5a6470'; ctx.fillRect(x, y, 13, 13);
      ctx.fillStyle = '#6a7480'; ctx.fillRect(x, y, 13, 4);
      ctx.fillStyle = '#4a5470'; ctx.fillRect(x + 8, y + 6, 4, 6);
    } else if (p.type === 'sword') { // crescent sword wave
      ctx.save(); ctx.translate(c, cy); ctx.rotate(Math.atan2(p.vy, p.vx));
      ctx.fillStyle = '#e8e8e8'; ctx.beginPath(); ctx.arc(8, 0, 9, -0.6, 0.6); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(8, 0, 5, -0.6, 0.6); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if (p.type === 'bullet') { // fast gun bullet
      ctx.save(); ctx.translate(c, cy); ctx.rotate(Math.atan2(p.vy, p.vx));
      ctx.fillStyle = '#ffd42a'; ctx.fillRect(-6, -2, 12, 4);
      ctx.fillStyle = '#fff'; ctx.fillRect(-2, -1, 6, 2);
      ctx.restore();
    } else if (p.type === 'spectral') { // ghostly homing bolt
      ctx.fillStyle = '#2bd4ff'; ctx.beginPath(); ctx.arc(c, cy, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#d8f2ff'; ctx.beginPath(); ctx.arc(c - 2, cy - 2, 3, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.5; ctx.fillStyle = '#2bd4ff'; ctx.beginPath(); ctx.arc(c - p.vx * 2, cy - p.vy * 2, 9, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    } else if (p.type === 'spike') { // spiked ball
      ctx.fillStyle = '#4a505c'; ctx.beginPath(); ctx.arc(c, cy, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#c3c8d4';
      for (var spk = 0; spk < 6; spk++) { var sa = spk / 6 * Math.PI * 2; ctx.fillRect(c + Math.cos(sa) * 6 - 2, cy + Math.sin(sa) * 6 - 2, 4, 4); }
      ctx.fillStyle = '#c00'; ctx.beginPath(); ctx.arc(c, cy, 3, 0, Math.PI * 2); ctx.fill();
    } else if (p.type === 'laser') { // laser beam
      ctx.save(); ctx.translate(c, cy); ctx.rotate(Math.atan2(p.vy, p.vx));
      ctx.fillStyle = '#ff3a2b'; ctx.fillRect(-16, -2, 32, 4);
      ctx.fillStyle = '#fff'; ctx.fillRect(-16, -1, 32, 2);
      ctx.fillStyle = 'rgba(255,60,40,0.4)'; ctx.fillRect(-16, -4, 32, 8);
      ctx.restore();
    } else if (p.type === 'gloop') { // sticky goo glob
      ctx.fillStyle = '#1e7a3a'; ctx.beginPath(); ctx.arc(c, cy, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2ecc40'; ctx.beginPath(); ctx.arc(c - 2, cy - 2, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#4de355'; ctx.beginPath(); ctx.arc(c - 3, cy - 3, 2, 0, Math.PI * 2); ctx.fill();
    } else { // spit
      ctx.fillStyle = '#5a1a78'; ctx.beginPath(); ctx.arc(c, cy, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#7a2bd4'; ctx.beginPath(); ctx.arc(c - 2, cy - 2, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#b04df0'; ctx.beginPath(); ctx.arc(c - 3, cy - 3, 2, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawPlatform(p) {
    var x = Math.round(p.px), y = Math.round(p.py), w = p.w;
    ctx.fillStyle = '#2b4a6b'; ctx.fillRect(x, y + 4, w, TS - 4);
    ctx.fillStyle = '#3f7296'; ctx.fillRect(x, y, w, 6);
    ctx.fillStyle = '#1a2f45'; ctx.fillRect(x, y + TS - 4, w, 4);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    for (var i = 4; i < w; i += 16) ctx.fillRect(x + i, y + 8, 6, 4);
  }

  // Floating feedback popups (world coords -> screen).
  function drawPopups() {
    for (var i = 0; i < popups.length; i++) {
      var p = popups[i];
      ctx.globalAlpha = Math.min(1, p.life / 18);
      ctx.fillStyle = '#000'; ctx.fillRect(p.x - camX - 14, p.y - camY - 12, 28, 13);
      ctx.fillStyle = p.color; ctx.font = 'bold 12px "Courier New", monospace';
      ctx.textAlign = 'center';

  // ---- Animated title demo: Gloop is chased by a swarm of enemies ----
  function initTitleDemo() {
    var types = ['patrol', 'charger', 'hopper', 'chaser', 'fireball', 'snake'];
    titleEnemies = [];
    for (var i = 0; i < types.length; i++) {
      titleEnemies.push({ type: types[i], x: 70 + i * 130, y: 150 + (i % 3) * 70, w: 32, h: 32, dir: 1, time: i * 2, alive: true, hidden: false, fire: 50 + i * 18 });
    }
    titleGloop = { x: 400, y: 260, dir: 1, time: 0 };
    titleShots = [];
  }

  // Tunneling: slide off one edge, reappear on the opposite side.
  function wrapActor(o) {
    if (o.x < -30) o.x = CANVAS_W + 20; if (o.x > CANVAS_W + 30) o.x = -20;
    if (o.y < -30) o.y = CANVAS_H + 20; if (o.y > CANVAS_H + 30) o.y = -20;
  }

  function updateTitleDemo() {
    titleGloop.time += 0.05;
    var ax = 0, ay = 0;
    for (var i = 0; i < titleEnemies.length; i++) { ax += titleEnemies[i].x; ay += titleEnemies[i].y; }
    ax /= titleEnemies.length; ay /= titleEnemies.length;
    var dx = titleGloop.x - ax, dy = titleGloop.y - ay;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    titleGloop.x += dx / len * 2.6; titleGloop.y += dy / len * 2.6;
    titleGloop.dir = dx > 0 ? 1 : -1;
    wrapActor(titleGloop); // Gloop tunnels through the walls

    for (var j = 0; j < titleEnemies.length; j++) {
      var e = titleEnemies[j]; e.time += 0.05;
      var ex = titleGloop.x - e.x, ey = titleGloop.y - e.y;
      var el = Math.sqrt(ex * ex + ey * ey) || 1;
      var sp = e.type === 'charger' ? 2.4 : (e.type === 'chaser' ? 2.0 : 1.6);
      e.x += ex / el * sp; e.y += ey / el * sp;
      e.dir = ex > 0 ? 1 : -1;
      wrapActor(e);
      // Each enemy fires its own unique projectile toward Gloop.
      e.fire--;
      if (e.fire <= 0 && titleShots.length < 40) {
        e.fire = 100 + (e.type.length * 17) % 60;
        var ang = Math.atan2(titleGloop.y - (e.y + 16), titleGloop.x - (e.x + 16));
        var st = titleShotStyles[e.type];
        titleShots.push({ x: e.x + 16, y: e.y + 16, vx: Math.cos(ang) * st.speed, vy: Math.sin(ang) * st.speed, type: e.type, style: st, alive: true });
      }
    }

    for (var si = titleShots.length - 1; si >= 0; si--) {
      var sh = titleShots[si];
      if (sh.style.homing) {
        var ha = Math.atan2(titleGloop.y - sh.y, titleGloop.x - sh.x);
        sh.vx += (Math.cos(ha) * sh.style.speed - sh.vx) * 0.08;
        sh.vy += (Math.sin(ha) * sh.style.speed - sh.vy) * 0.08;
      }
      sh.x += sh.vx; sh.y += sh.vy;
      if (sh.style.bounce) { if (sh.y < 4 || sh.y > CANVAS_H - 4) sh.vy *= -1; }
      if (sh.x < -30) sh.x = CANVAS_W + 20; if (sh.x > CANVAS_W + 30) sh.x = -20;
      if (sh.y < -30) sh.y = CANVAS_H + 20; if (sh.y > CANVAS_H + 30) sh.y = -20;
    }
  }

  function bossShotIndex() {
    var total = 0; var shots = (boss && boss.intro) || [];
    var elapsed = (boss && boss.introTotal || 0) - introTimer;
    for (var i = 0; i < shots.length; i++) { total += shots[i].d; if (elapsed < total) return { idx: i, elapsed: elapsed - (total - shots[i].d), shot: shots[i] }; }
    return { idx: shots.length - 1, elapsed: 0, shot: shots[shots.length - 1] };
  }

  // ---- SWORD KNIGHT (skin 5): epic forged knight saga ----
  function drawKnightCinematic() {
    var total = boss.introTotal || 2400;
    var p = Math.min(1, (total - introTimer) / total);
    var cx = CANVAS_W / 2, cy = CANVAS_H / 2;
    ctx.fillStyle = 'rgba(5,5,8,0.97)'; ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

      for (var d = 0; d < 14; d++) { var a = d * Math.PI * 2 / 14, dd = 170 + ((Math.floor(p * 12) + d) % 2) * 50;
        ctx.fillStyle = 'rgba(255,180,60,0.2)'; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * dd, cy + Math.sin(a) * dd * 0.5, 8 + Math.sin(p * 30 + d) * 3, 0, Math.PI * 2); ctx.fill(); }
