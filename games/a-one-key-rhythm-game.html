<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ONE KEY — a one-key rhythm game</title>
<style>
  :root{
    --cyan:#7df9ff;
    --mag:#b16cff;
    --ink:#0b0b16;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    overflow:hidden; background:#07070d;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  body{
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:#eaefff;
    -webkit-user-select:none; user-select:none;
  }
  #c{ display:block; position:fixed; inset:0; }

  .screen{
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center; padding:26px; gap:14px;
    background: radial-gradient(120% 90% at 50% 8%, rgba(22,22,52,.74), rgba(7,7,13,.95));
    animation: fade .22s ease both;
  }
  @keyframes fade{ from{opacity:0} to{opacity:1} }
  .screen.hidden{ display:none; }

  .kicker{
    font-size: clamp(10px, 2.8vw, 12px);
    letter-spacing:.42em; text-transform:uppercase;
    color:#7f8bc4; padding-left:.42em;
  }
  h1{
    margin:0; font-size: clamp(42px, 13.5vw, 104px);
    font-weight:900; letter-spacing:.04em; line-height:.92;
    background: linear-gradient(180deg,#ffffff 5%, #7df9ff 52%, #b16cff 100%);
    -webkit-background-clip:text; background-clip:text;
    color:transparent;
    filter: drop-shadow(0 6px 30px rgba(125,249,255,.35));
  }
  .how{
    font-size: clamp(15px, 4.1vw, 19px);
    color:#cfd8ff; line-height:1.55; max-width:34ch; margin:2px 0 0;
  }
  .how b{ color:var(--cyan); font-weight:800; }
  .how kbd{
    display:inline-block; padding:2px 9px; margin:0 1px;
    border-radius:7px; font:inherit; font-weight:800; font-size:.88em;
    background:linear-gradient(180deg,#2a2a52,#1a1a34);
    border:1px solid #3d3d70; border-bottom-width:3px;
    color:#dfe6ff;
  }
  .btn{
    margin-top:10px; border:none; cursor:pointer; font:inherit;
    font-weight:900; letter-spacing:.16em; text-transform:uppercase;
    font-size: clamp(14px, 3.9vw, 18px);
    padding:16px 40px; border-radius:999px;
    color:#05121b;
    background:linear-gradient(180deg,#c6feff,#5fd0ff 58%,#9a76ff);
    box-shadow:0 12px 34px rgba(95,208,255,.32), inset 0 -4px 0 rgba(0,0,0,.16);
    transition:transform .08s ease, box-shadow .2s ease;
  }
  .btn:hover{ box-shadow:0 16px 40px rgba(95,208,255,.45), inset 0 -4px 0 rgba(0,0,0,.16); }
  .btn:active{ transform:translateY(3px) scale(.985); }
  .hint{ font-size:11.5px; letter-spacing:.14em; color:#5f6a9c; text-transform:uppercase; }

  .big{
    font-size: clamp(30px, 9vw, 54px); font-weight:900; letter-spacing:.04em;
    background:linear-gradient(180deg,#fff,#ff9bb0 70%,#ff5a6e);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin:0;
  }
  .stats{
    display:flex; flex-wrap:wrap; justify-content:center; gap:8px 10px;
    max-width:420px; margin-top:4px;
  }
  .stat{
    min-width:74px; padding:8px 12px; border-radius:12px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
  }
  .stat .v{ font-size:19px; font-weight:900; color:#fff; }
  .stat .k{ font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:#7f8bc4; margin-top:2px; }
  .stat.p .v{ color:#7df9ff } .stat.g .v{ color:#9dff8f }
  .stat.o .v{ color:#ffd166 } .stat.m .v{ color:#ff5a6e }

  #mute{
    position:fixed; z-index:20; right:14px; bottom:14px;
    font:inherit; font-weight:800; font-size:10.5px; letter-spacing:.16em;
    text-transform:uppercase; cursor:pointer;
    padding:9px 14px; border-radius:999px;
    color:#aab4e0; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    transition:background .15s ease, color .15s ease;
  }
  #mute:hover{ background:rgba(255,255,255,.12); color:#fff; }
  #mute.off{ color:#ff8fa0; border-color:rgba(255,90,110,.35); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="screen" id="menu">
  <div class="kicker">a one-key rhythm game</div>
  <h1>ONE&nbsp;KEY</h1>
  <p class="how">Press <kbd>SPACE</kbd> (or tap) the instant a note lands on the glowing line.</p>
  <button class="btn" id="startBtn">Start</button>
  <div class="hint">headphones recommended &middot; sound is optional</div>
</div>

<div class="screen hidden" id="over">
  <div class="kicker">the beat dropped you</div>
  <h1 class="big">GAME OVER</h1>
  <div class="stats">
    <div class="stat"><div class="v" id="fScore">0</div><div class="k">Score</div></div>
    <div class="stat"><div class="v" id="fBest">0</div><div class="k">Best</div></div>
    <div class="stat"><div class="v" id="fCombo">0</div><div class="k">Max Combo</div></div>
    <div class="stat"><div class="v" id="fAcc">0%</div><div class="k">Accuracy</div></div>
    <div class="stat p"><div class="v" id="fPerfect">0</div><div class="k">Perfect</div></div>
    <div class="stat g"><div class="v" id="fGreat">0</div><div class="k">Great</div></div>
    <div class="stat o"><div class="v" id="fGood">0</div><div class="k">Good</div></div>
    <div class="stat m"><div class="v" id="fMiss">0</div><div class="k">Miss</div></div>
  </div>
  <button class="btn" id="againBtn">Play Again</button>
  <div class="hint">or press space</div>
</div>

<button id="mute" class="no-tap">Sound On</button>

<script>
(function(){
  'use strict';

  /* ------------------------------------------------------------------ *
   *  Canvas setup
   * ------------------------------------------------------------------ */
  var canvas = document.getElementById('c');
  var g = canvas.getContext('2d');

  var W = 1, H = 1, DPR = 1;
  var laneW = 120, laneX = 0, hitY = 0, topY = -90;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    laneW = Math.max(88, Math.min(160, W * 0.30));
    laneX = W / 2 - laneW / 2;
    hitY  = Math.round(H * 0.74);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  var FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
  function font(weight, size){ return weight + ' ' + size + 'px ' + FONT; }

  function rr(x, y, w, h, r){
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y,     x + w, y + h, r);
    g.arcTo(x + w, y + h, x,     y + h, r);
    g.arcTo(x,     y + h, x,     y,     r);
    g.arcTo(x,     y,     x + w, y,     r);
    g.closePath();
  }

  /* ------------------------------------------------------------------ *
   *  Clock
   * ------------------------------------------------------------------ */
  function now(){ return performance.now() / 1000; }

  /* ------------------------------------------------------------------ *
   *  Audio (lazy, fully guarded)
   * ------------------------------------------------------------------ */
  var actx = null, master = null, noiseBuf = null;
  var muted = false;

  function initAudio(){
    if (actx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      master = actx.createGain();
      master.gain.value = 0.34;
      master.connect(actx.destination);
    } catch (e){
      actx = null; master = null;
    }
  }

  function resumeAudio(){
    initAudio();
    if (actx && actx.state === 'suspended'){
      try { var p = actx.resume(); if (p && p.catch) p.catch(function(){}); } catch (e){}
    }
  }

  function audible(){
    return !!(actx && !muted && actx.state === 'running');
  }

  function atime(gameTime){
    if (!actx) return 0;
    return actx.currentTime + (gameTime - now());
  }

  function getNoise(){
    if (!actx) return null;
    if (noiseBuf) return noiseBuf;
    try {
      var len = Math.floor(actx.sampleRate * 0.25);
      noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e){ noiseBuf = null; }
    return noiseBuf;
  }

  function kick(t){
    if (!audible()) return;
    try {
      var o = actx.createOscillator(), gn = actx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(150, t);
      o.frequency.exponentialRampToValueAtTime(44, t + 0.13);
      gn.gain.setValueAtTime(0.0001, t);
      gn.gain.linearRampToValueAtTime(0.85, t + 0.006);
      gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
      o.connect(gn); gn.connect(master);
      o.start(t); o.stop(t + 0.27);
    } catch (e){}
  }

  function hat(t, vol){
    if (!audible()) return;
    try {
      var b = getNoise();
      if (!b) return;
      var s = actx.createBufferSource(); s.buffer = b;
      var f = actx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7200;
      var gn = actx.createGain();
      gn.gain.setValueAtTime(vol, t);
      gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      s.connect(f); f.connect(gn); gn.connect(master);
      s.start(t); s.stop(t + 0.07);
    } catch (e){}
  }

  function tone(freq, dur, type, vol, when){
    if (!audible()) return;
    try {
      var t = (typeof when === 'number') ? when : actx.currentTime;
      var o = actx.createOscillator(), gn = actx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      gn.gain.setValueAtTime(0.0001, t);
      gn.gain.linearRampToValueAtTime(vol, t + 0.008);
      gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(gn); gn.connect(master);
      o.start(t); o.stop(t + dur + 0.03);
    } catch (e){}
  }

  function hitSound(quality, combo){
    if (!audible()) return;
    var base = quality === 'perfect' ? 900 : (quality === 'great' ? 740 : 610);
    var f = base * (1 + Math.min(combo, 30) / 30 * 0.55);
    var t = actx.currentTime;
    tone(f, 0.17, 'triangle', 0.5, t);
    tone(f * 2, 0.08, 'sine', 0.16, t);
  }

  function missSound(){
    if (!audible()) return;
    try {
      var t = actx.currentTime;
      var o = actx.createOscillator(), gn = actx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(190, t);
      o.frequency.exponentialRampToValueAtTime(58, t + 0.26);
      gn.gain.setValueAtTime(0.26, t);
      gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      o.connect(gn); gn.connect(master);
      o.start(t); o.stop(t + 0.32);
    } catch (e){}
  }

  /* ------------------------------------------------------------------ *
   *  Game state
   * ------------------------------------------------------------------ */
  var BPM = 132;
  var BEAT = 60 / BPM;
  var APPROACH = 1.45;

  var state = 'menu';
  var notes = [], particles = [], pops = [], rings = [];

  var songStart = 0, genBeat = 0, schedBeat = 0, lastNoteTime = -99;
  var score = 0, best = 0, combo = 0, maxCombo = 0, health = 100;
  var nPerfect = 0, nGreat = 0, nGood = 0, nMiss = 0;
  var shake = 0, hitFlash = 0, missFlash = 0, comboPop = 0, beatPulse = 0;
  var overAt = 0, hiddenAt = 0;

  try { best = parseInt(localStorage.getItem('onekey_best') || '0', 10) || 0; } catch (e){ best = 0; }

  var menuEl = document.getElementById('menu');
  var overEl = document.getElementById('over');
  var muteEl = document.getElementById('mute');
  var fScore = document.getElementById('fScore');
  var fBest = document.getElementById('fBest');
  var fCombo = document.getElementById('fCombo');
  var fAcc = document.getElementById('fAcc');
  var fPerfect = document.getElementById('fPerfect');
  var fGreat = document.getElementById('fGreat');
  var fGood = document.getElementById('fGood');
  var fMiss = document.getElementById('fMiss');

  function startGame(){
    menuEl.classList.add('hidden');
    overEl.classList.add('hidden');

    notes.length = 0; particles.length = 0; pops.length = 0; rings.length = 0;
    score = 0; combo = 0; maxCombo = 0; health = 100;
    nPerfect = 0; nGreat = 0; nGood = 0; nMiss = 0;
    shake = 0; hitFlash = 0; missFlash = 0; comboPop = 0; beatPulse = 0;

    songStart = now() + 2.4;
    genBeat = 0; schedBeat = 0; lastNoteTime = -99;
    state = 'playing';
  }

  function gameOver(){
    if (state === 'over') return;
    state = 'over';
    overAt = now();
    if (score > best){
      best = score;
      try { localStorage.setItem('onekey_best', String(best)); } catch (e){}
    }
    var total = nPerfect + nGreat + nGood + nMiss;
    var weighted = (nPerfect * 1 + nGreat * 0.65 + nGood * 0.3);
    var acc = total ? Math.round(weighted / total * 100) : 0;

    fScore.textContent = String(score);
    fBest.textContent = String(best);
    fCombo.textContent = String(maxCombo);
    fAcc.textContent = acc + '%';
    fPerfect.textContent = String(nPerfect);
    fGreat.textContent = String(nGreat);
    fGood.textContent = String(nGood);
    fMiss.textContent = String(nMiss);

    overEl.classList.remove('hidden');
  }

  /* ------------------------------------------------------------------ *
   *  Chart generation
   * ------------------------------------------------------------------ */
  function addNote(time){
    if (time - lastNoteTime < 0.14) return;
    lastNoteTime = time;
    notes.push({ time: time, judged: false, dead: false });
  }

  function generateChart(t){
    var horizon = t + APPROACH + 0.35;
    var guard = 0;
    while (guard++ < 200){
      var bt = songStart + genBeat * BEAT;
      if (bt > horizon) break;
      if (bt < t - 0.2){ genBeat++; continue; }
      if (bt >= songStart - 0.001){
        var elapsed = bt - songStart;
        var intensity = Math.min(1, elapsed / 70);
        var inBar = ((genBeat % 4) + 4) % 4;
        var p;
        if (genBeat < 8)         p = (inBar === 0) ? 1 : 0;
        else if (inBar === 0)    p = 1;
        else if (inBar === 2)    p = 0.45 + 0.5 * intensity;
        else                     p = 0.20 + 0.65 * intensity;
        if (Math.random() < p) addNote(bt);

        var halfChance = 0.12 + 0.5 * intensity;
        if (genBeat >= 16 && inBar !== 3 && Math.random() < halfChance) addNote(bt + BEAT * 0.5);
      }
      genBeat++;
    }
  }

  function scheduleMusic(t){
    var horizon = t + 0.12;
    var on = audible();
    var guard = 0;
    while (guard++ < 64){
      var bt = songStart + schedBeat * BEAT;
      if (bt > horizon) break;
      if (bt < t - 0.2){ schedBeat++; continue; }
      if (on && bt > t - 0.05){
        var at = atime(bt);
        if (schedBeat % 4 === 0)      kick(at);
        else if (schedBeat % 2 === 0) hat(at, 0.10);
        else                          hat(at, 0.055);
      }
      schedBeat++;
    }
  }

  /* ------------------------------------------------------------------ *
   *  Judging
   * ------------------------------------------------------------------ */
  var COL = {
    perfect: '#7df9ff',
    great:   '#9dff8f',
    good:    '#ffd166',
    miss:    '#ff5a6e'
  };

  function noteY(n, t){
    var p = 1 - (n.time - t) / APPROACH;
    return topY + p * (hitY - topY);
  }

  function spawnBurst(y, quality){
    var color = COL[quality] || '#ffffff';
    var count = quality === 'perfect' ? 26 : (quality === 'great' ? 18 : 12);
    for (var i = 0; i < count; i++){
      var a = Math.random() * Math.PI * 2;
      var sp = 90 + Math.random() * 340;
      particles.push({
        x: W / 2, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 90,
        life: 0.45 + Math.random() * 0.45,
        size: 2 + Math.random() * 4.5,
        color: color
      });
    }
    rings.push({ x: W / 2, y: y, life: 0.4, max: 0.4, color: color, maxR: laneW * 1.5 });
  }

  function addPop(text, color){
    pops.push({ text: text, color: color, life: 0.72, max: 0.72, y: hitY - 74 });
  }

  function onHit(n, quality, t){
    combo++;
    if (combo > maxCombo) maxCombo = combo;

    var base = quality === 'perfect' ? 300 : (quality === 'great' ? 200 : 100);
    score += base + Math.min(combo, 60) * 2;

    var heal = quality === 'perfect' ? 2.5 : (quality === 'great' ? 1.5 : 0.5);
    health = Math.min(100, health + heal);

    if (quality === 'perfect') nPerfect++;
    else if (quality === 'great') nGreat++;
    else nGood++;

    var y = noteY(n, t);
    spawnBurst(y, quality);
    addPop(quality.toUpperCase(), COL[quality]);
    shake = quality === 'perfect' ? 5 : 2.5;
    hitFlash = 1;
    comboPop = 1;
    hitSound(quality, combo);

    n.dead = true;
  }

  function onMiss(n){
    nMiss++;
    combo = 0;
    health -= 12;
    missFlash = 1;
    shake = 9;
    addPop('MISS', COL.miss);
    missSound();
    n.dead = true;
  }

  function press(){
    if (state !== 'playing'){ requestStart(); return; }
    var t = now();
    var bestNote = null, bestAbs = Infinity;
    for (var i = 0; i < notes.length; i++){
      var n = notes[i];
      if (n.judged) continue;
      var d = t - n.time;
      if (d < -0.18 || d > 0.18) continue;
      var a = d < 0 ? -d : d;
      if (a < bestAbs){ bestAbs = a; bestNote = n; }
    }
    if (!bestNote){ hitFlash = Math.max(hitFlash, 0.22); return; }

    bestNote.judged = true;
    var q;
    if (bestAbs <= 0.050)      q = 'perfect';
    else if (bestAbs <= 0.095) q = 'great';
    else if (bestAbs <= 0.150) q = 'good';
    else                       q = 'miss';

    if (q === 'miss') onMiss(bestNote);
    else onHit(bestNote, q, t);
  }

  function requestStart(){
    if (state === 'playing') return;
    if (state === 'over' && now() - overAt < 0.6) return;
    resumeAudio();
    startGame();
  }

  /* ------------------------------------------------------------------ *
   *  Update
   * ------------------------------------------------------------------ */
  function update(dt, t){
    if (state === 'playing'){
      if (t >= songStart - APPROACH - 0.6) generateChart(t);
      scheduleMusic(t);

      var bt = (t - songStart) / BEAT;
      if (bt > 0){
        var frac = bt - Math.floor(bt);
        beatPulse = Math.pow(1 - frac, 2.2);
      } else {
        beatPulse = 0;
      }

      for (var i = 0; i < notes.length; i++){
        var n = notes[i];
        if (!n.judged && t - n.time > 0.16) onMiss(n);
      }
      for (var j = notes.length - 1; j >= 0; j--){
        var m = notes[j];
        if (m.dead || t - m.time > 1.0) notes.splice(j, 1);
      }

      if (health <= 0){ health = 0; gameOver(); }
    } else {
      beatPulse = 0;
    }

    for (var p = particles.length - 1; p >= 0; p--){
      var q = particles[p];
      q.life -= dt;
      if (q.life <= 0){ particles.splice(p, 1); continue; }
      q.vy += 900 * dt;
      q.x += q.vx * dt;
      q.y += q.vy * dt;
    }
    for (var r = rings.length - 1; r >= 0; r--){
      rings[r].life -= dt;
      if (rings[r].life <= 0) rings.splice(r, 1);
    }
    for (var o = pops.length - 1; o >= 0; o--){
      var pp = pops[o];
      pp.life -= dt;
      pp.y -= 62 * dt;
      if (pp.life <= 0) pops.splice(o, 1);
    }

    shake = Math.max(0, shake - dt * 42);
    hitFlash = Math.max(0, hitFlash - dt * 4.2);
    missFlash = Math.max(0, missFlash - dt * 2.6);
    comboPop = Math.max(0, comboPop - dt * 4);
  }

  /* ------------------------------------------------------------------ *
   *  Draw
   * ------------------------------------------------------------------ */
  function drawField(t){
    // lane
    var lg = g.createLinearGradient(0, 0, 0, hitY);
    lg.addColorStop(0, 'rgba(255,255,255,0.015)');
    lg.addColorStop(1, 'rgba(150,190,255,0.075)');
    g.fillStyle = lg;
    rr(laneX, -30, laneW, hitY + 60, 26);
    g.fill();

    g.strokeStyle = 'rgba(150,190,255,0.10)';
    g.lineWidth = 1;
    rr(laneX, -30, laneW, hitY + 60, 26);
    g.stroke();

    // beat lines
    var kStart = Math.floor((t - 0.3 - songStart) / BEAT);
    var kEnd   = Math.ceil((t + APPROACH - songStart) / BEAT);
    if (kEnd - kStart > 64) kStart = kEnd - 64;
    g.lineWidth = 1;
    for (var k = kStart; k <= kEnd; k++){
      var bt = songStart + k * BEAT;
      var p = 1 - (bt - t) / APPROACH;
      if (p < 0 || p > 1) continue;
      var y = topY + p * (hitY - topY);
      var down = (((k % 4) + 4) % 4) === 0;
      g.strokeStyle = down ? 'rgba(125,249,255,0.20)' : 'rgba(150,190,255,0.07)';
      g.beginPath();
      g.moveTo(laneX + 7, y);
      g.lineTo(laneX + laneW - 7, y);
      g.stroke();
    }

    // combo (behind notes)
    if (state === 'playing' && combo >= 2){
      var cs = 1 + Math.min(combo, 60) / 60 * 0.32 + comboPop * 0.28;
      var size = Math.min(W * 0.24, 150) * cs;
      g.save();
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.globalAlpha = 0.92;
      var cg = g.createLinearGradient(0, H * 0.30 - size / 2, 0, H * 0.30 + size / 2);
      cg.addColorStop(0, '#ffffff');
      cg.addColorStop(1, '#7df9ff');
      g.fillStyle = cg;
      g.shadowColor = 'rgba(125,249,255,0.55)';
      g.shadowBlur = 26;
      g.font = font(900, Math.round(size));
      g.fillText(String(combo), W / 2, H * 0.30);
      g.shadowBlur = 0;
      g.globalAlpha = 0.6;
      g.fillStyle = '#8f9bd8';
      g.font = font(800, Math.round(Math.min(W * 0.032, 13)));
      g.fillText('C O M B O', W / 2, H * 0.30 + size * 0.62);
      g.restore();
    }

    // hit target
    var nw = laneW * 0.80;
    var nh = Math.min(laneW * 0.52, 58);
    var hx = W / 2 - nw / 2, hy = hitY - nh / 2;
    var tscale = 1 + beatPulse * 0.05 + hitFlash * 0.06;
    g.save();
    g.translate(W / 2, hitY);
    g.scale(tscale, tscale);
    g.translate(-W / 2, -hitY);

    g.fillStyle = 'rgba(125,249,255,' + (0.05 + hitFlash * 0.42) + ')';
    rr(hx, hy, nw, nh, nh * 0.3);
    g.fill();

    g.lineWidth = 2 + hitFlash * 2;
    g.strokeStyle = 'rgba(180,225,255,' + (0.35 + hitFlash * 0.6) + ')';
    if (hitFlash > 0.02){
      g.shadowColor = 'rgba(125,249,255,0.9)';
      g.shadowBlur = 26 * hitFlash;
    }
    rr(hx, hy, nw, nh, nh * 0.3);
    g.stroke();
    g.shadowBlur = 0;
    g.restore();

    // line across lane
    g.strokeStyle = 'rgba(200,230,255,' + (0.28 + hitFlash * 0.55) + ')';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(laneX, hitY);
    g.lineTo(laneX + laneW, hitY);
    g.stroke();
  }

  function drawNotes(t){
    var nw = laneW * 0.80;
    var nh = Math.min(laneW * 0.52, 58);
    for (var i = 0; i < notes.length; i++){
      var n = notes[i];
      if (n.dead) continue;
      var y = noteY(n, t);
      if (y < -140 || y > H + 140) continue;

      var p = 1 - (n.time - t) / APPROACH;
      var s = 1;
      if (p < 0.12) s = 0.55 + 0.45 * (p / 0.12);
      else if (p > 0.9) s = 1 + (p - 0.9) * 0.6;

      g.save();
      g.translate(W / 2, y);
      g.scale(s, s);
      g.translate(-W / 2, -y);

      var grad = g.createLinearGradient(0, y - nh / 2, 0, y + nh / 2);
      grad.addColorStop(0, '#d8fdff');
      grad.addColorStop(0.5, '#7df9ff');
      grad.addColorStop(1, '#9a76ff');

      g.shadowColor = 'rgba(125,249,255,0.85)';
      g.shadowBlur = 18;
      g.fillStyle = grad;
      rr(W / 2 - nw / 2, y - nh / 2, nw, nh, nh * 0.3);
      g.fill();
      g.shadowBlur = 0;

      g.fillStyle = 'rgba(255,255,255,0.75)';
      rr(W / 2 - nw / 2 + 10, y - nh / 2 + 6, nw - 20, 3, 2);
      g.fill();

      g.restore();
    }
  }

  function drawParticles(){
    for (var i = 0; i < particles.length; i++){
      var p = particles[i];
      var a = Math.max(0, Math.min(1, p.life / 0.6));
      g.globalAlpha = a;
      g.fillStyle = p.color;
      g.beginPath();
      g.arc(p.x, p.y, p.size * (0.4 + a * 0.6), 0, Math.PI * 2);
      g.fill();
    }
    g.globalAlpha = 1;
  }

  function drawRings(){
    for (var i = 0; i < rings.length; i++){
      var r = rings[i];
      var prog = 1 - r.life / r.max;
      var rad = r.maxR * Math.sqrt(prog);
      g.globalAlpha = Math.max(0, 1 - prog) * 0.7;
      g.strokeStyle = r.color;
      g.lineWidth = 3 * (1 - prog) + 1;
      g.beginPath();
      g.arc(r.x, r.y, rad, 0, Math.PI * 2);
      g.stroke();
    }
    g.globalAlpha = 1;
  }

  function drawPops(){
    for (var i = 0; i < pops.length; i++){
      var p = pops[i];
      var a = Math.max(0, p.life / p.max);
      g.save();
      g.globalAlpha = a;
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillStyle = p.color;
      g.shadowColor = p.color;
      g.shadowBlur = 16;
      g.font = font(900, Math.round(Math.min(W * 0.055, 26)));
      g.fillText(p.text, W / 2, p.y);
      g.restore();
    }
    g.globalAlpha = 1;
  }

  function drawHUD(t){
    // health bar
    var hbw = Math.min(420, W - 44);
    var hbx = W / 2 - hbw / 2;
    g.fillStyle = 'rgba(255,255,255,0.08)';
    rr(hbx, 20, hbw, 11, 6);
    g.fill();

    var hp = Math.max(0, Math.min(100, health)) / 100;
    if (hp > 0){
      var col = hp > 0.5 ? '#6ef0a0' : (hp > 0.25 ? '#ffd166' : '#ff5a6e');
      g.fillStyle = col;
      g.shadowColor = col;
      g.shadowBlur = 12;
      rr(hbx, 20, Math.max(8, hbw * hp), 11, 6);
      g.fill();
      g.shadowBlur = 0;
    }

    // score / best
    g.textBaseline = 'top';
    g.textAlign = 'left';
    g.fillStyle = '#6f7bb4';
    g.font = font(800, 10.5);
    g.fillText('SCORE', 20, 50);
    g.fillStyle = '#ffffff';
    g.font = font(900, Math.min(W * 0.075, 30));
    g.fillText(String(score), 20, 63);

    g.textAlign = 'right';
    g.fillStyle = '#6f7bb4';
    g.font = font(800, 10.5);
    g.fillText('BEST', W - 20, 50);
    g.fillStyle = '#cfd8ff';
    g.font = font(900, Math.min(W * 0.075, 30));
    g.fillText(String(Math.max(best, score)), W - 20, 63);

    // lead-in count
    if (state === 'playing' && t < songStart){
      var lead = songStart - t;
      var beatsLeft = Math.ceil(lead / BEAT);
      var label = beatsLeft <= 4 ? String(beatsLeft) : 'READY';
      var pop = 1 - (lead / BEAT - Math.floor(lead / BEAT));
      g.save();
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.globalAlpha = 0.55 + 0.4 * beatPulse;
      g.fillStyle = '#dfe8ff';
      g.shadowColor = 'rgba(125,249,255,0.6)';
      g.shadowBlur = 22;
      g.font = font(900, Math.round(Math.min(W * 0.11, 66) * (1 + pop * 0.06)));
      g.fillText(label, W / 2, H * 0.42);
      g.restore();
    }
  }

  function draw(t){
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, W, H);

    var bg = g.createRadialGradient(W / 2, H * 0.18, 0, W / 2, H * 0.18, Math.max(W, H) * 1.05);
    bg.addColorStop(0, '#161637');
    bg.addColorStop(0.55, '#0c0c1c');
    bg.addColorStop(1, '#07070d');
    g.fillStyle = bg;
    g.fillRect(0, 0, W, H);

    // beat glow near the line
    if (beatPulse > 0.01){
      var glow = g.createRadialGradient(W / 2, hitY, 0, W / 2, hitY, laneW * 3.2);
      glow.addColorStop(0, 'rgba(125,249,255,' + (0.14 * beatPulse) + ')');
      glow.addColorStop(1, 'rgba(125,249,255,0)');
      g.fillStyle = glow;
      g.fillRect(0, 0, W, H);
    }

    var sx = (Math.random() - 0.5) * shake;
    var sy = (Math.random() - 0.5) * shake;

    g.save();
    g.translate(sx, sy);
    drawField(t);
    drawNotes(t);
    drawParticles();
    drawRings();
    drawPops();
    g.restore();

    if (missFlash > 0.01){
      var vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.2, W / 2, H / 2, Math.max(W, H) * 0.75);
      vg.addColorStop(0, 'rgba(255,60,90,0)');
      vg.addColorStop(1, 'rgba(255,60,90,' + (0.45 * missFlash) + ')');
      g.fillStyle = vg;
      g.fillRect(0, 0, W, H);
    }

    drawHUD(t);
  }

  /* ------------------------------------------------------------------ *
   *  Loop
   * ------------------------------------------------------------------ */
  var lastT = now();
  function frame(){
    var t = now();
    var dt = t - lastT;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    lastT = t;
    update(dt, t);
    draw(t);
    requestAnimationFrame(frame);
  }

  /* ------------------------------------------------------------------ *
   *  Input
   * ------------------------------------------------------------------ */
  function isUI(el){
    return !!(el && el.closest && el.closest('button, .no-tap'));
  }

  window.addEventListener('keydown', function(e){
    if (e.repeat) return;
    if (e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar'){
      e.preventDefault();
      resumeAudio();
      press();
      return;
    }
    if (e.key === 'm' || e.key === 'M'){
      toggleMute();
      return;
    }
    if (e.key === 'Enter'){
      resumeAudio();
      requestStart();
    }
  });

  window.addEventListener('pointerdown', function(e){
    resumeAudio();
    if (isUI(e.target)) return;
    press();
  }, { passive: true });

  window.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  document.getElementById('startBtn').addEventListener('pointerdown', function(e){
    e.stopPropagation();
    requestStart();
  });
  document.getElementById('againBtn').addEventListener('pointerdown', function(e){
    e.stopPropagation();
    requestStart();
  });

  function toggleMute(){
    muted = !muted;
    if (!muted) resumeAudio();
    muteEl.textContent = muted ? 'Sound Off' : 'Sound On';
    if (muted) muteEl.classList.add('off');
    else muteEl.classList.remove('off');
  }
  muteEl.addEventListener('pointerdown', function(e){
    e.stopPropagation();
    toggleMute();
  });

  document.addEventListener('visibilitychange', function(){
    if (document.hidden){
      hiddenAt = now();
    } else if (hiddenAt){
      var d = now() - hiddenAt;
      hiddenAt = 0;
      if (state === 'playing' && d > 0.2){
        songStart += d;
        for (var i = 0; i < notes.length; i++) notes[i].time += d;
        lastT = now();
      }
    }
  });

  /* ------------------------------------------------------------------ *
   *  Boot
   * ------------------------------------------------------------------ */
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
